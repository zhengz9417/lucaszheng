<body class="min-h-screen">

<main class="max-w-6xl mx-auto px-4 py-6">
  <!-- 连接/创建 -->

      </div>
    </div>
    <div class="mt-5 flex flex-wrap gap-3">

    <p class="opacity-60 text-xs mt-2 leading-snug">

    </p>

  <!-- 大厅 -->
  <section id="lobby" class="hidden glass rounded-2xl p-5 md:p-7 mt-6">
    <div class="flex items-center justify-between flex-wrap gap-3">

        <div class="text-[15px] opacity-80">房间号：<span id="roomShow" class="font-mono px-2 py-1 rounded bg-[#0b142a] border border-[#334155]"></span></div>

        </div>
        <div class="flex items-center gap-2">

<script>
/* ========== Firebase 基础 ========== */
const app = firebase.initializeApp(window.firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

function setAuthBadge(txt, ok=false){
  const b = document.getElementById('authBadge');
  b.textContent = 'Auth: ' + txt;
  b.style.borderColor = ok ? '#34d39980' : '#fb718580';
  b.style.color = ok ? '#34d399' : '#fb7185';
}
async function ensureAuth(){
  if (auth.currentUser){ setAuthBadge(auth.currentUser.uid.slice(0,8)+'…', true); return auth.currentUser; }
  const u = await auth.signInAnonymously();
  setAuthBadge(u.user.uid.slice(0,8)+'…', true);
  return u.user;
}

/* ========== 工具 & 全局 ========== */
let ROOM_ID=null, isHost=false, uid=null, me={uid:null,name:""};
let L=null, S=null, myCards=[], myCardsHash="";
let unsubLobby=null, unsubState=null, unsubEvents=null, unsubMyHand=null, unsubActions=null;
let hasHostAction=false;

const SUITS = ['♠','♥','♦','♣'];
const RANKS = ['2','3','4','5','6','7','8','9','T','J','Q','K','A'];

function roomRefs(roomId){
  const room = db.collection('poker_rooms').doc(roomId);
  return {
    room,
    lobby: room.collection('meta').doc('lobby'),
    state: room.collection('meta').doc('state'),
    actions: room.collection('actions'),
    events: room.collection('events'),
    hands: room.collection('hands'),
  };
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function makeDeck(){ const d=[]; for(const r of RANKS) for(const s of SUITS) d.push({r,s}); return shuffle(d); }
function seatName(i){ return 'S'+(i+1); }
function nextAliveFrom(arr, start){
  const n=arr.length; for(let k=1;k<=n;k++){const j=(start+k)%n;const p=arr[j]; if(p && p.seated && p.stack>0 && p.inHand!==false) return j;}
  return start;
}
function writeLobbyFrom(H){
  const { lobby } = roomRefs(ROOM_ID);
  const canStart = (H.players.filter(p=>p && p.seated).length >= 2) && (!S || !S.street);
  return lobby.set({
    hostUid: H.hostUid,
    settings: H.settings,
    seats: H.players.map(p=> p? {uid:p.uid,name:p.name,seated:p.seated,stack:p.stack||0} : null),
    canStart
  }, { merge:true });
}
function writeStateFrom(H){
  const { state } = roomRefs(ROOM_ID);
  const data = {
    handNo: H.handNo||0,
    dealer: H.dealer ?? null,
    street: H.street||null,
    pot: H.pot||0,
    board: H.board||[],
    toCall: H.toCall||0,
    lastRaise: H.lastRaise||0,
    action: H.action ?? null,
    players: H.players.map(p=> p? {uid:p.uid,name:p.name,seated:p.seated,stack:p.stack,bet:p.bet||0,inHand:p.inHand!==false} : null),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    winner: H.winner||null,
    needShowdown: !!H.needShowdown
  };
  return state.set(data);
}
async function sendHandsFrom(H){
  const { hands } = roomRefs(ROOM_ID);
  const ops=[];
  for(const p of H.players){
    if (!p) continue;
    const h = p.cards||[];
    ops.push(hands.doc(p.uid).set({ ownerUid:p.uid, cards:h }));
  }
  await Promise.all(ops);
}

/* ========== Host 权威状态 ========== */
let H=null;

async function hostInit(roomId, name){
  isHost=true; ROOM_ID=roomId; me.name=name;
  const user = await ensureAuth(); uid=user.uid; me.uid=uid;

  const { state } = roomRefs(ROOM_ID);
  await state.delete().catch(()=>{});

  H = {
    hostUid: uid,
    settings:{ seats:8, startStack:2000, sb:10, bb:20 },
    players: new Array(8).fill(null),
    handNo:0, dealer:-1, street:null, board:[], pot:0, toCall:0, lastRaise:0, action:null, winner:null, needShowdown:false
  };
  H.players[0] = { uid, name, seated:true, stack:H.settings.startStack, bet:0, inHand:false, cards:[] };

  await writeLobbyFrom(H);
  await writeStateFrom(H);

  attachCommonListeners();
  attachHostActionListener();

  enterLobbyUI();
  document.getElementById('roomShow').textContent = ROOM_ID;
  document.getElementById('roleShow').textContent = 'Host';
  document.getElementById('hostPanel').classList.remove('hidden');
  document.getElementById('btnCloseRoom').classList.remove('hidden');
  document.getElementById('btnLeave').classList.add('hidden');
}

async function guestJoin(roomId, name){
  isHost=false; ROOM_ID=roomId; me.name=name;
  const user = await ensureAuth(); uid=user.uid; me.uid=uid;
  attachCommonListeners();
  enterLobbyUI();
  document.getElementById('roomShow').textContent = ROOM_ID;
  document.getElementById('roleShow').textContent = 'Guest';
  document.getElementById('hostPanel').classList.add('hidden');
  document.getElementById('btnCloseRoom').classList.add('hidden');
  document.getElementById('btnLeave').classList.remove('hidden');
}

async function hostApplySettings(){
  if (!H) return;
  const seats = Math.max(2, Math.min(8, Number(document.getElementById('seatMax').value||8)));
  const startStack = Math.max(100, Number(document.getElementById('startStack').value||2000));
  const sb = Math.max(1, Number(document.getElementById('sb').value||10));
  const bb = Math.max(sb*2, Number(document.getElementById('bb').value||20));

  let arr = new Array(seats).fill(null);
  const cur = (H.players||[]).filter(Boolean);
  // host 保留
  const hostP = cur.find(p=>p.uid===uid) || { uid, name:me.name, seated:true, stack:startStack, bet:0, inHand:false, cards:[] };
  arr[0] = hostP;
  // 其他人塞进去
  let k=0;
  for(let i=1;i<seats && k<cur.length;i++){
    const p = cur[k++];
    if (p.uid===uid){ i--; continue; }
    arr[i]=p;
  }
  H.players = arr;
  H.settings = { seats, startStack, sb, bb };
  await writeLobbyFrom(H);
  await writeStateFrom(H);
}

async function hostTakeSeat(seat, _uid, name){
  if (!H || (S && S.street)) return;
  if (seat<0 || seat>=H.players.length) return;
  if (H.players[seat]) return;
  if (H.players.find(p=>p && p.uid===_uid)) return;
  H.players[seat] = { uid:_uid, name, seated:true, stack:H.settings.startStack, bet:0, inHand:false, cards:[] };
  await writeLobbyFrom(H);
  await writeStateFrom(H);
}
async function hostLeaveSeat(_uid){
  if (!H || (S && S.street)) return;
  const idx = H.players.findIndex(p=>p && p.uid===_uid);
  if (idx>=0){ H.players[idx]=null; await writeLobbyFrom(H); await writeStateFrom(H); }
}
function everyoneAllInOrFolded(){
  const actives = H.players.filter(p=>p&&p.seated&&p.inHand!==false);
  const notAllIn = actives.filter(p=>p.stack>0 && p.bet !== H.toCall);
  return notAllIn.length===0;
}
function resetBets(){
  for(const p of H.players){ if (p) p.bet=0; }
  H.toCall=0; H.lastRaise=H.settings.bb;
}
function postBlinds(){
  const n = H.players.length;
  const btn = H.dealer;
  const sbIdx = nextAliveFrom(H.players, btn);
  const bbIdx = nextAliveFrom(H.players, sbIdx);
  function post(idx, amt){
    const p = H.players[idx]; if (!p) return 0;
    const pay = Math.min(amt, p.stack);
    p.stack -= pay; p.bet = (p.bet||0)+pay;
    return pay;
  }
  H.pot = 0;
  H.pot += post(sbIdx, H.settings.sb);
  H.pot += post(bbIdx, H.settings.bb);
  H.toCall = Math.max(H.settings.bb, H.toCall||0);
  H.lastRaise = H.settings.bb;
  H.action = nextAliveFrom(H.players, bbIdx); // UTG
}

function dealCards(){
  const deck = makeDeck();
  for(const p of H.players){ if(p && p.seated && p.stack>0){ p.cards=[deck.pop(), deck.pop()]; p.inHand=true; } else if (p){ p.cards=[]; p.inHand=false; } }
  H._deck = deck; // 临时保留在内存（不写库）
}
function burn(){ H._deck.pop(); }
function flop(){ burn(); H.board=[H._deck.pop(),H._deck.pop(),H._deck.pop()]; }
function turn(){ burn(); H.board.push(H._deck.pop()); }
function river(){ burn(); H.board.push(H._deck.pop()); }

async function hostStartHand(){
  if (!H) return;
  const seated = H.players.filter(p=>p&&p.seated);
  if (seated.length<2) return alert('至少需要 2 名玩家入座');

  H.handNo = (H.handNo||0)+1;
  H.winner = null; H.needShowdown=false;

  // 轮转庄位到下一个可参与的玩家
  if (H.dealer==null || H.dealer<0) H.dealer = H.players.findIndex(p=>p&&p.seated&&p.stack>0);
  else H.dealer = nextAliveFrom(H.players, H.dealer);

  H.street='preflop'; H.board=[]; resetBets();
  dealCards();
  postBlinds();

  await sendHandsFrom(H);
  await writeLobbyFrom(H);
  await writeStateFrom(H);
}

function isHandOver(){
  const alive = H.players.filter(p=>p&&p.seated&&p.inHand!==false);
  return alive.length<=1;
}
function advanceStreetIfReady(){
  const actives = H.players.filter(p=>p&&p.seated&&p.inHand!==false);
  // 所有人下注额相等（或 all-in 差额不可补）才进入下一街
  const targetBet = Math.max(0, ...actives.map(p=>p.bet||0));
  const need = actives.filter(p=> (p.stack>0) && ((p.bet||0) !== targetBet));
  if (need.length>0) return false;
  // 下一街
  resetBets();
  if (H.street==='preflop'){ flop(); H.street='flop'; }
  else if (H.street==='flop'){ turn(); H.street='turn'; }
  else if (H.street==='turn'){ river(); H.street='river'; }
  else if (H.street==='river'){ H.street='showdown'; H.needShowdown=true; }
  // 新一街从庄家左侧第一个存活者行动
  H.action = nextAliveFrom(H.players, H.dealer);
  return true;
}
function moveAction(){
  H.action = nextAliveFrom(H.players, H.action);
}

async function hostFold(_uid){
  const idx = H.players.findIndex(p=>p&&p.uid===_uid);
  if (idx<0) return;
  const p = H.players[idx];
  p.inHand=false;
  if (isHandOver()){
    // 奖励唯一存活者
    const winner = H.players.find(pp=>pp&&pp.seated&&pp.inHand!==false);
    if (winner){ winner.stack += (H.pot||0) + H.players.reduce((s,pp)=>s+(pp?pp.bet||0:0),0); }
    H.pot=0; resetBets(); H.street=null; H.winner={uid:winner.uid,name:winner.name}; H.needShowdown=false;
  }else{
    if (H.action===idx) moveAction();
    // 若所有下注完成则推进街次
    advanceStreetIfReady();
  }
  await writeStateFrom(H);
}

async function hostCheckCall(_uid){
  const idx = H.players.findIndex(p=>p&&p.uid===_uid);
  if (idx<0) return;
  const p = H.players[idx];
  const need = Math.max(0, (H.toCall||0) - (p.bet||0));
  const pay = Math.min(need, p.stack);
  p.stack -= pay; p.bet = (p.bet||0) + pay;
  H.pot += pay;
  moveAction();
  // 若所有人到齐，推进街次
  advanceStreetIfReady();
  await writeStateFrom(H);
}
async function hostBetRaise(_uid, rawAmt){
  const idx = H.players.findIndex(p=>p&&p.uid===_uid);
  if (idx<0) return;
  const p = H.players[idx];
  let amt = Math.floor(Number(rawAmt)||0);
  if (amt<=0) return;
  const needCall = Math.max(0, (H.toCall||0) - (p.bet||0));
  let raiseSize = amt - needCall; // 净加注额
  if (H.toCall>0){
    // 加注：至少等于上一次加注额度
    if (raiseSize < H.lastRaise) raiseSize = H.lastRaise;
    amt = needCall + raiseSize;
  }else{
    // 下注：至少等于大盲
    if (amt < H.settings.bb) amt = H.settings.bb;
    raiseSize = amt;
  }
  amt = Math.min(amt, p.stack + needCall); // all-in 允许小于最小加注
  const pay = Math.max(0, amt);
  const realPay = Math.min(pay, p.stack);
  p.stack -= realPay;
  p.bet = (p.bet||0) + needCall + realPay; // 注意：needCall 里玩家已补的在上一步已包含，本行只叠加实际支付
  H.pot += realPay;
  const newToCall = Math.max(H.toCall, p.bet||0);
  H.lastRaise = Math.max(H.lastRaise, raiseSize);
  H.toCall = newToCall;

  moveAction();
  await writeStateFrom(H);
}

/* 摊牌（简化：Host 选赢家 / 或点击平分） */
async function hostAward(uidX){
  const w = H.players.find(p=>p&&p.uid===uidX);
  if (!w) return;
  const total = (H.pot||0) + H.players.reduce((s,p)=>s+(p? p.bet||0 : 0),0);
  w.stack += total;
  H.pot = 0; resetBets(); H.street=null; H.needShowdown=false; H.winner={uid:w.uid,name:w.name};
  await writeStateFrom(H);
}
async function hostSplit(){
  const actives = H.players.filter(p=>p&&p.seated&&p.inHand!==false);
  const total = (H.pot||0) + H.players.reduce((s,p)=>s+(p? p.bet||0 : 0),0);
  const each = Math.floor(total / actives.length);
  let remain = total - each*actives.length;
  for(const p of actives){ p.stack += each; }
  // 剩余筹码给庄家左手边开始顺次发
  let giveIdx = nextAliveFrom(H.players, H.dealer);
  while(remain>0){
    const p = H.players[giveIdx];
    if (p && p.seated && p.inHand!==false){ p.stack += 1; remain--; }
    giveIdx = nextAliveFrom(H.players, giveIdx);
  }
  H.pot=0; resetBets(); H.street=null; H.needShowdown=false; H.winner=null;
  await writeStateFrom(H);
}

/* ========== Actions 总线（Host 处理） ========== */
function attachHostActionListener(){
  if (hasHostAction) return;
  const { actions } = roomRefs(ROOM_ID);
  unsubActions && unsubActions();
  unsubActions = actions.orderBy('ts').limitToLast(200).onSnapshot(async (qs)=>{
    for(const ch of qs.docChanges()){
      if (ch.type!=='added') continue;
      const doc = ch.doc; const a = doc.data()||{};
      if (a.processed) continue;
      try{
        switch(a.type){
          case 'TAKE_SEAT': await hostTakeSeat(a.seat, a.uid, a.name); break;
          case 'LEAVE_SEAT': await hostLeaveSeat(a.uid); break;
          case 'HOST_APPLY': if (a.uid===uid) await hostApplySettings(); break;
          case 'HOST_DEAL':  if (a.uid===uid) await hostStartHand(); break;
          case 'FOLD':       await hostFold(a.uid); break;
          case 'CHECK_CALL': await hostCheckCall(a.uid); break;
          case 'BET_RAISE':  await hostBetRaise(a.uid, a.amount); break;
          case 'SHOWDOWN_AWARD': if (a.uid===uid) await hostAward(a.winnerUid); break;
          case 'SHOWDOWN_SPLIT': if (a.uid===uid) await hostSplit(); break;
          case 'BACK_TO_LOBBY':  await backToLobbyReset(); break;
          case 'CHAT': await emitEvent('CHAT', { uid:a.uid, name:a.name, text:(a.text||'').toString().slice(0,400) }); break;
        }
      } finally { await doc.ref.update({ processed:true, processedBy:uid }); }
    }
  });
  hasHostAction = true;
}
async function emitEvent(type, payload){
  const { events } = roomRefs(ROOM_ID);
  await events.add({ type, payload, ts: firebase.firestore.FieldValue.serverTimestamp() });
}

/* ========== 公用监听 ========== */
let chatCache=[];

function attachCommonListeners(){
  const { lobby, state, events, hands } = roomRefs(ROOM_ID);

  chatCache=[]; const chatListEl=document.getElementById('chatList'); if (chatListEl) chatListEl.innerHTML='';

  unsubLobby && unsubLobby();
  unsubLobby = lobby.onSnapshot((doc)=>{
    if (!doc.exists){ handleRoomClosedUI(); return; }
    L = doc.data();
    isHost = (L.hostUid === (auth.currentUser && auth.currentUser.uid));
    document.getElementById('hostPanel').classList.toggle('hidden', !isHost);
    document.getElementById('btnCloseRoom').classList.toggle('hidden', !isHost);
    document.getElementById('btnLeave').classList.toggle('hidden', isHost);

    renderLobby(L);
    const btn = document.getElementById('btnDeal');
    if (btn && isHost) btn.disabled = !L.canStart;

    if (isHost && !hasHostAction) attachHostActionListener();
  });

  unsubState && unsubState();
  unsubState = state.onSnapshot((doc)=>{
    if (!doc.exists){ S=null; enterLobbyUI(); return; }
    S = doc.data();
    renderAll();
  });

  unsubEvents && unsubEvents();
  unsubEvents = events.orderBy('ts').limitToLast(200).onSnapshot((qs)=>{
    qs.docChanges().forEach(ch=>{
      const e = ch.doc.data();
      if (e.type==='CHAT'){
        chatCache.push({ ...e.payload, ts:e.ts });
        renderChat();
      }
    });
  });

  unsubMyHand && unsubMyHand();
  unsubMyHand = hands.doc(auth.currentUser.uid).onSnapshot((doc)=>{
    if (!doc.exists){ myCards=[]; myCardsHash=""; renderAll(); return; }
    const h = doc.data()?.cards || [];
    const hash = h.map(c=>c.r+c.s).join('|');
    if (hash!==myCardsHash){ myCards=h; myCardsHash=hash; renderAll(); }
  });
}

/* ========== UI 渲染 ========== */
function enterLobbyUI(){ document.getElementById('connect').classList.add('hidden'); document.getElementById('game').classList.add('hidden'); document.getElementById('lobby').classList.remove('hidden'); }
function enterGameUI(){ document.getElementById('lobby').classList.add('hidden'); document.getElementById('game').classList.remove('hidden'); }

function renderLobby(lobby){
  const seatsDiv = document.getElementById('seats'); seatsDiv.innerHTML='';
  const seatsN = lobby.settings?.seats || 8;
  const gameRunning = !!(S && S.street);
  for(let i=0;i<seatsN;i++){
    const cell = document.createElement('div'); cell.className="rounded-xl p-3 border border-[#334155] bg-[#0b142a]";
    const occ = (lobby.seats||[])[i];
    if (occ){
      const canLeave = (occ.uid === (auth.currentUser && auth.currentUser.uid)) && !gameRunning && (occ.uid!==lobby.hostUid);
      cell.innerHTML = `<div class="font-semibold mb-1">座位 ${i+1}</div>
        <div class="opacity-90">${occ.name}</div>
        <div class="text-sm opacity-70 mt-1">筹码：${occ.stack??0}</div>
        ${canLeave?`<button class="btn btn-danger w-full mt-2">退出座位</button>`:''}`;
      if (canLeave){
        cell.querySelector('button').onclick = ()=> sendAction({ type:'LEAVE_SEAT' });
      }
    }else{
      const canSit = !gameRunning;
      cell.innerHTML = `<div class="font-semibold mb-2">座位 ${i+1}</div>
        <button class="btn ${canSit?'btn-green':'disabled:opacity-60'} w-full" ${canSit?'':'disabled'}>${canSit?'加入此座位':'本手进行中'}</button>`;
      if (canSit) cell.querySelector('button').onclick = ()=> sendAction({ type:'TAKE_SEAT', seat:i });
    }
    seatsDiv.appendChild(cell);
  }
  document.getElementById('roomShow').textContent = ROOM_ID;
}

function cardHTML(c){ if (!c) return `<div class="card">🂠</div>`; return `<div class="card">${c.r}<span style="opacity:.8">${c.s}</span></div>`; }

function renderAll(){
  if (!S || !S.players){ enterLobbyUI(); if (L) renderLobby(L); return; }
  enterGameUI();

  document.getElementById('handNo').textContent = S.handNo||0;
  document.getElementById('dealerSeat').textContent = (S.dealer!=null && S.dealer>=0) ? ('S'+(S.dealer+1)) : '—';
  document.getElementById('street').textContent = S.street||'—';
  document.getElementById('potAmt').textContent = S.pot ?? 0;

  const actP = (S.action!=null) ? S.players[S.action] : null;
  document.getElementById('actionName').textContent = actP ? (actP.name + `（需跟到 ${S.toCall||0}）`) : '—';

  // 公共牌
  const board = document.getElementById('board'); board.innerHTML='';
  (S.board||[]).forEach(c=> board.insertAdjacentHTML('beforeend', cardHTML(c)));

  // 玩家行
  const row = document.getElementById('playersRow'); row.innerHTML='';
  S.players.forEach((p,i)=>{
    if (!p) return;
    const div = document.createElement('div');
    div.className = `rounded-xl p-3 border ${i===S.dealer?'border-amber-400/70':'border-[#334155]'} bg-[#0b142a] ${p.inHand? '':'folded'} ${((auth.currentUser&&auth.currentUser.uid)===p.uid)?'me':''} ${i===S.action?'active':''}`;
    div.innerHTML = `
      <div class="flex items-center justify-between">
        <div class="font-semibold">${p.name}</div>
        <div class="text-sm opacity-80">筹码：${p.stack}</div>
      </div>
      <div class="text-sm opacity-80 mt-1">本街下注：${p.bet||0}</div>
      <div class="text-xs mt-1">${i===S.dealer? 'D':''}</div>
    `;
    row.appendChild(div);
  });

  // 我的底牌
  const myHand = document.getElementById('myHand'); myHand.innerHTML='';
  (myCards||[]).forEach(c=> myHand.insertAdjacentHTML('beforeend', cardHTML(c)));

  // 行动按钮可用性
  const myUid = auth.currentUser && auth.currentUser.uid;
  const mySeat = S.players.findIndex(p=>p&&p.uid===myUid);
  const myP = mySeat>=0 ? S.players[mySeat] : null;
  const myTurn = (S.action===mySeat) && myP && myP.inHand;

  document.getElementById('btnFold').disabled = !myTurn;
  document.getElementById('btnCheckCall').disabled = !myTurn;
  document.getElementById('btnBet').disabled = !myTurn;
  document.getElementById('betAmt').disabled = !myTurn;

  // Host 摊牌裁定
  const hostBox = document.getElementById('hostShowdown');
  const btns = document.getElementById('showdownBtns');
  hostBox.classList.toggle('hidden', !(isHost && S.needShowdown));
  if (isHost && S.needShowdown){
    btns.innerHTML='';
    S.players.forEach(p=>{
      if (p && p.inHand){
        const b = document.createElement('button');
        b.className='btn'; b.textContent = `授予：${p.name}`;
        b.onclick = ()=> sendAction({ type:'SHOWDOWN_AWARD', winnerUid:p.uid });
        btns.appendChild(b);
      }
    });
  }

  // Host 返回大厅
  document.getElementById('btnHostToLobby').classList.toggle('hidden', !(isHost));
}

function renderChat(){
  const list = document.getElementById('chatList');
  list.innerHTML='';
  chatCache.sort((a,b)=>{
    const ta = a.ts?.toMillis ? a.ts.toMillis() : (a.ts?.seconds||0)*1000;
    const tb = b.ts?.toMillis ? b.ts.toMillis() : (b.ts?.seconds||0)*1000;
    return ta - tb;
  });
  chatCache.forEach(m=>{
    const div = document.createElement('div');
    div.className = 'chat-item' + (m.uid===(auth.currentUser&&auth.currentUser.uid)?' chat-me':'');
    const name = escapeHTML(m.name||'?');
    const text = escapeHTML(m.text||'');
    div.innerHTML = `<b>${name}</b>：${text}`;
    list.appendChild(div);
  });
  list.scrollTop = list.scrollHeight;
}
function escapeHTML(s){ return (s||'').replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

/* ========== 杂项 ========== */
async function backToLobbyReset(){
  if (!H) return;
  // 结束本手，清理到大厅可再次入座/开始
  H.street=null; H.board=[]; H.pot=0; H.toCall=0; H.lastRaise=H.settings.bb; H.action=null; H.needShowdown=false; H.winner=null;
  for(const p of H.players){ if (p){ p.bet=0; p.inHand=false; p.cards=[]; } }
  await sendHandsFrom(H);
  await writeLobbyFrom(H);
  await writeStateFrom(H);
  enterLobbyUI();
}
async function closeRoom(){
  const { room, lobby, state, actions, events, hands } = roomRefs(ROOM_ID);
  async function delCol(col){ const snap = await col.get(); const ops=[]; snap.forEach(d=>ops.push(d.ref.delete())); await Promise.all(ops); }
  await Promise.all([
    lobby.delete().catch(()=>{}),
    state.delete().catch(()=>{}),
    delCol(actions).catch(()=>{}),
    delCol(events).catch(()=>{}),
    delCol(hands).catch(()=>{}),
  ]);
  await room.delete().catch(()=>{});
}
function handleRoomClosedUI(){
  detachAll();
  ROOM_ID=null; isHost=false; myCards=[]; myCardsHash=""; chatCache=[];
  document.getElementById('lobby').classList.add('hidden');
  document.getElementById('game').classList.add('hidden');
  document.getElementById('connect').classList.remove('hidden');
  alert('房间已关闭');
}
function detachAll(){
  unsubLobby && unsubLobby(); unsubLobby=null;
  unsubState && unsubState(); unsubState=null;
  unsubEvents && unsubEvents(); unsubEvents=null;
  unsubMyHand && unsubMyHand(); unsubMyHand=null;
  unsubActions && unsubActions(); unsubActions=null;
}
async function sendAction(data){
  await ensureAuth();
  const { actions } = roomRefs(ROOM_ID);
  return actions.add({ ...data, uid:auth.currentUser.uid, name:me.name, ts: firebase.firestore.FieldValue.serverTimestamp(), processed:false });
}

/* ========== 事件绑定 ========== */
document.getElementById('btnCreate').onclick = async ()=>{
  const name = (document.getElementById('nick').value||'Player').trim();
  const rid = Math.random().toString(36).slice(2,7).toUpperCase();
  await hostInit(rid, name);
};
document.getElementById('btnJoin').onclick = async ()=>{
  const name = (document.getElementById('nick').value||'Player').trim();
  const rid = (document.getElementById('roomInput').value||'').trim().toUpperCase();
  if (!rid) return alert('请输入房间号');
  await guestJoin(rid, name);
};

document.getElementById('btnCloseRoom').onclick = async ()=>{ if (!isHost) return; await closeRoom(); handleRoomClosedUI(); };
document.getElementById('btnLeave').onclick = async ()=>{ detachAll(); ROOM_ID=null; document.getElementById('lobby').classList.add('hidden'); document.getElementById('game').classList.add('hidden'); document.getElementById('connect').classList.remove('hidden'); };

document.getElementById('seatMax').addEventListener('change', ()=> isHost && sendAction({ type:'HOST_APPLY' }));
document.getElementById('startStack').addEventListener('change', ()=> isHost && sendAction({ type:'HOST_APPLY' }));
document.getElementById('sb').addEventListener('change', ()=> isHost && sendAction({ type:'HOST_APPLY' }));
document.getElementById('bb').addEventListener('change', ()=> isHost && sendAction({ type:'HOST_APPLY' }));

document.getElementById('btnDeal').onclick = ()=> isHost ? sendAction({ type:'HOST_DEAL' }) : null;
document.getElementById('btnHostToLobby').onclick = ()=> sendAction({ type:'BACK_TO_LOBBY' });

document.getElementById('btnFold').onclick = ()=> sendAction({ type:'FOLD' });
document.getElementById('btnCheckCall').onclick = ()=> sendAction({ type:'CHECK_CALL' });
document.getElementById('btnBet').onclick = ()=>{
  const v = document.getElementById('betAmt').value;
  sendAction({ type:'BET_RAISE', amount: Number(v||0) });
};

/* 摊牌（Host） */
document.getElementById('btnSplit').onclick = ()=> isHost && sendAction({ type:'SHOWDOWN_SPLIT' });
document.getElementById('btnNextHand').onclick = ()=> isHost && sendAction({ type:'HOST_DEAL' });

/* 聊天 */
document.getElementById('btnSendChat').onclick = async ()=>{
  const inp = document.getElementById('chatInput');
  const v = inp.value.trim(); if (!v) return;
  inp.value=''; await sendAction({ type:'CHAT', text:v });
};
document.getElementById('chatInput').addEventListener('keydown', (e)=>{ if (e.key==='Enter'){ e.preventDefault(); document.getElementById('btnSendChat').click(); } });

/* 启动 */
ensureAuth().catch(()=>{});
</script>
