<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>Liar’s Bar – Host/Join (Firebase)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Firebase SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <!-- 你的项目配置 -->
  <script src="firebase-init.js"></script>

  <style>
    :root{
      --bg1:#0b1020; --bg2:#111936; --felt:#0e3a1c; --felt2:#0a2d15;
      --panel:#10172bcc; --panel-strong:#0f162dcc;
      --glow:#6ee7ff; --glow2:#a78bfa; --accent:#7dd3fc; --danger:#fb7185; --okay:#34d399; --amber:#fbbf24;
    }
    body{ font-family:'Oxanium',ui-sans-serif,system-ui; color:#e5ecff;
      background:
        radial-gradient(900px 600px at 10% -10%, #1a2759 0%, transparent 60%),
        radial-gradient(900px 600px at 100% 10%, #1b2a5b 0%, transparent 55%),
        linear-gradient(180deg,var(--bg1),var(--bg2));
    }
    .glass{background:var(--panel); backdrop-filter: blur(10px); border:1px solid #33415566; box-shadow: 0 10px 30px rgba(0,0,0,.3);}
    .glass-strong{background:var(--panel-strong); backdrop-filter: blur(12px); border:1px solid #47556980;}
    .neon-title{background: linear-gradient(90deg,var(--glow),var(--glow2)); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:0 0 22px rgba(110,231,255,.28)}
    .btn{border:1px solid #5b6b8a66; padding:.55rem 1rem; border-radius:.9rem; background:linear-gradient(180deg,#111a34,#0c1429); color:#e5ecff; transition: box-shadow .15s ease, transform .15s ease}
    .btn:hover{box-shadow:0 0 0 3px rgba(99,102,241,.18); transform: translateY(-1px)}
    .btn-prim{border-color:#6366f180; background:linear-gradient(180deg,#4f46e5,#4338ca); box-shadow:0 10px 20px rgba(79,70,229,.28)}
    .btn-danger{border-color:#fb718580;background:linear-gradient(180deg,#ef4444,#dc2626)}
    .btn-amber{border-color:#fbbf2480;background:linear-gradient(180deg,#f59e0b,#d97706)}
    .btn-green{border-color:#34d39980;background:linear-gradient(180deg,#10b981,#059669)}
    .badge{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid #64748b66;background:linear-gradient(180deg,#0e1730,#0b1226)}
    .dead{opacity:.55;filter:grayscale(.35)}
    .ping{position:relative}
    .ping::after{content:"";position:absolute;inset:-4px;border-radius:999px;border:2px solid var(--okay);opacity:.4;animation:ping 1.2s cubic-bezier(0,0,.2,1) infinite}

    .felt{ border:1px solid #335244; border-radius:14px; padding:16px;
      background:
        radial-gradient(800px 300px at -20% -30%, rgba(255,255,255,.06), transparent 60%),
        radial-gradient(600px 280px at 120% -10%, rgba(255,255,255,.05), transparent 55%),
        linear-gradient(180deg, var(--felt), var(--felt2));
      box-shadow: inset 0 0 40px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.05);
    }
    .pot-flash{animation:potFlash .5s ease;}
    @keyframes potFlash{0%{box-shadow:0 0 0 0 rgba(125,211,252,.0)} 60%{box-shadow:0 0 0 8px rgba(125,211,252,.15)} 100%{box-shadow:0 0 0 0 rgba(125,211,252,.0)}}

    .card{ position:relative; width:62px; height:86px; margin:4px; display:inline-block; perspective:700px; }
    .card .inner{ position:absolute; inset:0; border-radius:12px; transform-style:preserve-3d; transition: transform .6s ease; transform: rotateY(0deg); }
    .card .front, .card .back{
      position:absolute; inset:0; border-radius:12px; backface-visibility:hidden;
      display:flex; align-items:center; justify-content:center; gap:2px;
      font-weight:700; letter-spacing:.5px;
      border:1px solid #94a3b880;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 6px 16px rgba(0,0,0,.35);
    }
    .card .front{ background:linear-gradient(180deg,#10192d,#0a1224); color:#e2e8f0; }
    .card .back{
      transform: rotateY(180deg);
      background:
        repeating-linear-gradient(45deg,#0d1226 0 6px,#0a1020 6px 12px),
        linear-gradient(180deg,#0c1429,#0a1122);
      color:#99a; text-shadow:0 1px 0 rgba(0,0,0,.4);
    }
    .face-back .inner{ transform: rotateY(180deg); }
    .card.sel .inner{ outline:2px solid var(--accent); box-shadow:0 0 0 6px rgba(125,211,252,.13); transform: translateY(-4px) }
    .rank{font-size:22px; line-height:1}
    .glyph{font-size:16px; opacity:.85}
    .joker .front{ background:repeating-linear-gradient(45deg,#0e1833 0 7px,#0b142a 7px 14px); }

    .burst{animation:burst .18s ease both;}
    @keyframes burst{ 0%{transform:translateY(-2px) scale(1.02)} 100%{transform:translateY(-8px) scale(1.08)} }
    .shake{animation:shake .38s cubic-bezier(.36,.07,.19,.97) both;}
    @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}

    .dice-wrap{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:80}
    .dice{ width:120px; height:120px; border-radius:20px; background:linear-gradient(180deg,#1f2937,#111827);
      border:1px solid #93c5fd55; box-shadow:0 20px 60px rgba(59,130,246,.35), inset 0 3px 0 rgba(255,255,255,.06);
      display:grid; place-items:center; animation:pop .55s cubic-bezier(.2,.8,.2,1); }

    .smoke-layer{position:fixed; inset:0; pointer-events:none; z-index:40; overflow:hidden;}
    .puff{position:absolute; bottom:-60px; width:120px; height:120px; border-radius:50%;
      background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.15), rgba(255,255,255,.03) 60%, transparent 70%);
      filter: blur(2px); opacity:.0; animation:rise linear forwards;}
    @keyframes rise{0%{transform:translate(var(--x,0),0) scale(.6);opacity:0}10%{opacity:.25}80%{opacity:.15}100%{transform:translate(var(--x,0),-120vh) scale(1.2);opacity:0}}

    .confetti{position:fixed; top:-10px; width:8px; height:14px; opacity:.9; z-index:60; background:linear-gradient(180deg,#fff,#ddd); will-change:transform; animation:fall linear forwards;}
    @keyframes fall{to{transform:translate3d(var(--tx),110vh,0) rotate(var(--rot))}}

    .roll-banner{margin-top:.5rem; font-size:.85rem; border:1px solid #334155; background:#0b142a; padding:.35rem .6rem; border-radius:.6rem}

    /* 聊天样式 */
    .chat-wrap{border:1px solid #334155; background:#0b142a; border-radius:12px; padding:10px;}
    .chat-list{max-height:260px; overflow:auto; display:flex; flex-direction:column; gap:6px;}
    .chat-item{font-size:14px; line-height:1.35; background:#0d1630; border:1px solid #334155; border-radius:10px; padding:6px 10px; max-width:80%;}
    .chat-me{border-color:#60a5fa99; align-self:flex-end;}

    /* 恶魔牌标记 */
    .demon .front .rank{ color:#fb7185; text-shadow:0 0 8px rgba(251,113,133,.35); }

    /* ======= Polish pack (drop-in) 可删 ======= */
    :root {
      --brand:#7dd3fc; --brand-ink:#38bdf8; --accent:#fbbf24; --text:#e5ecff;
      --elev-1:0 6px 16px rgba(0,0,0,.28); --elev-2:0 10px 24px rgba(0,0,0,.34);
    }
    .glass{background:#0f1626cc; border-color:#2a3a5a80; box-shadow:var(--elev-1)}
    .glass-strong{background:#0b1222e6; border-color:#3b4a70a0; box-shadow:var(--elev-2)}
    .neon-title{background: linear-gradient(90deg,var(--brand),#a78bfa20);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 18px rgba(125,211,252,.18)}
    header .btn{padding:.5rem .9rem;}
  </style>
</head>
<body class="min-h-screen">
  <!-- 顶栏 -->
  <header class="glass-strong sticky top-0 z-20">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="btn flex items-center gap-2" id="hdrBack">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9l5 4"/><path d="M6 9h12"/></svg>
          <span id="hdrBackTxt">返回主网页</span>
        </a>
        <h1 class="text-xl md:text-2xl font-bold neon-title" id="hdrTitle">Liar’s Bar</h1>
      </div>
      <div class="flex items-center gap-2">
        <span id="authBadge" class="badge">Auth: —</span>
        <!-- Host/Guest 都显示为“退出房间” -->
        <button id="btnExitRoom" class="btn">退出房间</button>
      </div>
    </div>
  </header>

  <!-- 烟雾层 -->
  <div id="smokeLayer" class="smoke-layer hidden"></div>

  <main class="max-w-6xl mx-auto px-4 py-6">
    <!-- 连接/创建 -->
    <section id="connect" class="glass rounded-2xl p-5 md:p-7">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-lg md:text-xl font-semibold" id="connTitle">进入或创建房间</h2>
        <div class="flex items-center gap-2">
          <span class="opacity-80 select-none">🌐 语言 / Language</span>
          <select id="langSel" class="rounded-xl bg-[#0b142a] border border-[#3b4a70] p-2.5">
            <option value="zh">中文</option>
            <option value="en">English</option>
          </select>
        </div>
      </div>
      <div class="grid md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm opacity-90 mb-1" id="lblNick">你的昵称</label>
          <input id="nick" class="w-full rounded-xl bg-[#0b142a] border border-[#3b4a70] p-3 text-[15px]" placeholder="例如：Ann" />
        </div>
        <div>
          <label class="block text-sm opacity-90 mb-1" id="lblRoom">房间号（加入时填写）</label>
          <input id="roomInput" class="w-full rounded-xl bg-[#0b142a] border border-[#3b4a70] p-3 text-[15px]" placeholder="例如：ABCD1" />
        </div>
      </div>
      <div class="mt-5 flex flex-wrap gap-3">
        <button id="btnCreate" class="btn btn-prim">我是主机（创建房间）</button>
        <button id="btnJoin" class="btn btn-green">加入房间</button>
      </div>

      <!-- 免责声明 -->
      <p id="disclaimer" class="opacity-60 text-xs mt-2 leading-snug"></p>

      <!-- 折叠：规则 & 提醒 -->
      <div class="mt-6 space-y-3">
        <details class="glass rounded-xl p-3">
          <summary class="cursor-pointer font-semibold" id="rulesSummary">游戏规则</summary>
          <div id="rulesBody" class="opacity-90 mt-2 text-sm leading-relaxed"></div>
        </details>
        <details class="glass rounded-xl p-3">
          <summary class="cursor-pointer font-semibold" id="tipsSummary">使用提醒</summary>
          <div id="tipsBody" class="opacity-90 mt-2 text-sm leading-relaxed"></div>
        </details>
      </div>

      <p class="opacity-70 text-sm mt-3" id="localNote">跨设备联机版（Firebase Firestore 实时）。</p>
    </section>

    <!-- 大厅 -->
    <section id="lobby" class="hidden glass rounded-2xl p-5 md:p-7 mt-6">
      <div class="flex items-center justify-between flex-wrap gap-3">
        <div>
          <div class="text-[15px] opacity-80"><span id="lblRoomShow">房间号：</span><span id="roomShow" class="font-mono px-2 py-1 rounded bg-[#0b142a] border border-[#334155]"></span></div>
          <div class="text-[15px] opacity-80 mt-1"><span id="lblRole">我的身份：</span><span id="roleShow" class="font-semibold"></span></div>
        </div>
        <div id="hostPanel" class="hidden flex items-center gap-3 flex-wrap">
          <div class="flex items-center gap-2">
            <label class="text-sm opacity-80" id="lblSeats">座位数（2–4）</label>
            <select id="seatMax" class="rounded-xl bg-[#0b142a] border border-[#3b4a70] p-2.5">
              <option>2</option><option>3</option><option selected>4</option>
            </select>
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm opacity-80" id="lblStartHand">起始手牌</label>
            <input id="startHand" type="number" min="3" max="9" value="5" class="w-20 rounded-xl bg-[#0b142a] border border-[#3b4a70] p-2.5"/>
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm opacity-80" id="lblDemon">恶魔牌模式</label>
            <input id="demonMode" type="checkbox" class="w-5 h-5">
          </div>
          <button id="btnStart" class="btn btn-prim disabled:opacity-50" disabled>开始游戏</button>
        </div>
      </div>
      <div id="seats" class="mt-5 grid grid-cols-2 md:grid-cols-4 gap-4"></div>
      <p class="opacity-70 text-sm mt-2" id="seatsTip">提示：点击空位即可入座；Host 调整座位数会出现/隐藏位置。</p>
    </section>

    <!-- 游戏 -->
    <section id="game" class="hidden glass rounded-2xl p-5 md:p-7 mt-6">
      <div class="flex flex-wrap items-center gap-2 mb-4">
        <span class="badge"><span id="lblRound">回合：</span><b id="roundNo"></b></span>
        <span class="badge"><span id="lblTarget">目标：</span><b id="targetRank" class="text-sky-300"></b></span>
        <span class="badge"><span id="lblCurrent">当前：</span><b id="currentPlayer" class="text-emerald-300"></b></span>
        <span class="badge"><span id="lblRoomId">房间：</span><b id="roomIdInGame"></b></span>
        <span id="yourTurnTag" class="badge hidden ping" style="border-color:#34d399;color:#34d399">你的回合</span>

        <!-- Host 的中途操作 -->
        <button id="btnHostNewGame" class="btn btn-amber hidden ml-auto">新一局</button>
        <button id="btnHostToLobby" class="btn hidden">返回大厅</button>
      </div>

      <div id="playersRow" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3 mb-4"></div>

      <div id="felt" class="felt mb-4">
        <div class="flex items-center justify-between">
          <h3 class="font-semibold" id="lblTable">桌面</h3>
          <div id="lastClaim" class="text-sm opacity-80"></div>
        </div>
        <div id="pot" class="mt-3"></div>
      </div>

      <div class="grid md:grid-cols-3 gap-4">
        <div class="md:col-span-2">
          <h3 class="font-semibold mb-2" id="lblMyHand">我的手牌（点击选择任意张）</h3>
          <div id="hand" class="min-h-[92px]"></div>
        </div>
        <div class="md:col-span-1">
          <h3 class="font-semibold mb-2" id="lblActions">操作</h3>
          <div class="flex flex-wrap gap-2">
            <button id="btnPlay" class="btn btn-prim disabled:opacity-50">出牌（0）</button>
            <button id="btnLiar" class="btn btn-danger">liar</button>
            <button id="btnReveal" class="btn btn-amber hidden">翻开判定</button>
          </div>
          <p class="opacity-80 text-sm mt-2" id="revealHint">只翻最近一次出牌，3 秒后判定并出现掷骰动画；失败者掷到 6 立刻死亡，或掷到同点第二次死亡。</p>
        </div>
      </div>

      <!-- 骰子动画层 -->
      <div id="diceLayer" class="dice-wrap hidden">
        <div class="dice" id="diceBox"></div>
      </div>

      <div id="winnerWrap" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4 z-40">
        <div class="glass-strong rounded-2xl p-6 max-w-md w-full text-center">
          <h3 class="text-xl font-bold mb-2" id="winTitle">胜利！</h3>
          <p class="mb-4"><span id="winnerName" class="font-semibold"></span> <span id="winText">获得胜利 🎉</span></p>
          <div class="flex items-center justify-center gap-2 flex-wrap">
            <button id="btnNewGame" class="btn btn-prim hidden">再来一局</button>
            <button id="btnBackLobby" class="btn">返回大厅</button>
          </div>
        </div>
      </div>

      <!-- 聊天 -->
      <div id="chatWrap" class="chat-wrap mt-4 hidden">
        <div class="flex items-center justify-between mb-2">
          <h3 class="font-semibold" id="lblChat">聊天</h3>
          <span class="text-xs opacity-70" id="lblChatHint">仅本局保留</span>
        </div>
        <div id="chatList" class="chat-list"></div>
        <div class="flex gap-2 mt-2">
          <input id="chatInput" class="flex-1 rounded-xl bg-[#0b142a] border border-[#3b4a70] p-2.5 text-[14px]" placeholder="说点什么…" />
          <button id="btnSendChat" class="btn">发送</button>
        </div>
      </div>

      <div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-6 hidden z-30">
        <div class="px-4 py-2 rounded-full shadow bg-black/70 text-white">提示</div>
      </div>
    </section>
  </main>

<script>
/* ===================== i18n ===================== */
let LANG = localStorage.getItem('lb_lang') || 'zh';
const i18n = {
  zh:{
    back:"返回主网页", title:"Liar’s Bar",
    connectTitle:"进入或创建房间", nick:"你的昵称", room:"房间号（加入时填写）",
    create:"我是主机（创建房间）", join:"加入房间",
    disclaimer:"本网页灵感来自 Steam 平台的《Liar’s Bar》，仅供学习与非商业用途；如有侵权请联系移除。",
    localNote:"跨设备联机版（Firebase Firestore 实时）。",
    roomShow:"房间号：", role:"我的身份：", roleHost:"Host", roleGuest:"Guest",
    seats:"座位数（2–4）", startHand:"起始手牌", demon:"恶魔牌模式",
    start:"开始游戏",
    seatsTip:"提示：点击空位即可入座；Host 调整座位数会出现/隐藏位置。",
    seatN:n=>`座位 ${n}`, joinSeat:"加入此座位", leaveSeat:"退出座位", seated:"在座", eliminated:"淘汰",
    round:"回合：", target:"目标：", current:"当前：", roomId:"房间：", yourTurn:"你的回合",
    table:"桌面", recent:(name,c)=>`最近：${name} × ${c}`, myHand:"我的手牌（点击选择任意张）", actions:"操作",
    play:c=>`出牌（${c}）`, liar:"liar", reveal:"翻开判定",
    revealHint:"只翻最近一次出牌，3 秒后判定并出现掷骰动画；失败者掷到 6 立刻死亡，或掷到同点第二次死亡。",
    handCount:c=>`手牌 ${c}`, diceList:r=>`骰：${r}`, playing:"出牌中", unknown:"未知",
    toastTurn:"你的回合", needOne:"请选择至少 1 张", need2p:"至少需要 2 名玩家入座",
    notEnough:"牌不够，请调小起始手牌或座位数",
    winner:"胜利！", winText:"获得胜利 🎉", newGame:"新一局",
    claim:(who,target,count)=>`${who}：宣称 ${target} × ${count}`,
    rollBanner:(name,v,dead)=> dead ? `${name} 掷出 ${v} —— 淘汰！` : `${name} 掷出 ${v} —— 安全`,
    phNick:"例如：Ann", phRoom:"例如：ABCD1",
    rulesSummary:"游戏规则", tipsSummary:"使用提醒",
    chat:"聊天", chatHint:"仅本局保留",
    exitRoom:"退出房间", hostToLobby:"返回大厅",
    rulesHTML: `
<b>牌池：</b>A×6、Q×6、K×6、JOKER×2（JOKER 万能）<br/>
<b>开局：</b>2–4 人可开始；默认每人 5 张（Host 可调整）<br/>
<b>目标：</b>每回合随机目标牌（A/Q/K），本轮打出的牌都视作目标<br/>
<b>出牌：</b>任意张数宣称“都是目标”；<b>恶魔牌</b>仅可单张出（启用时）<br/>
<b>质疑：</b>仅下家可点 liar 质疑上一家<br/>
<b>判定：</b>只翻最近一次出牌；全是目标→质疑者罚；否则→出牌者罚<br/>
<b>掷骰（罚者）：</b>掷到 6 立刻淘汰；非 6 记一次；第二次掷到同点淘汰<br/>
<b>恶魔牌判定：</b>若被质疑并翻开为恶魔牌，则除出牌者外所有存活者各掷一次<br/>
<b>回合结束：</b>重新发牌、清桌、随机新目标，由本次胜者先手<br/>
<b>胜利：</b>仅剩 1 名存活者<br/>
<b>空手与两人规则：</b>出完牌的玩家之后自动跳过；若场上仅剩 1 人有牌且上一家刚出完，该玩家只能质疑；两人局亦同<br/>
<b>观战/入座：</b>未入座即观战；对局中不能入座；一局结束 Host 可回大厅重新选座再开局<br/>
<b>退出：</b>退出座位仅在大厅；退出房间会离开房间，Host 退出将解散房间<br/>
<b>聊天：</b>所有人可见，仅保留本局消息<br/>
<b>房间号：</b>游戏内显示，便于后续加入
`,
    tipsHTML: `

/* ===================== Firebase 基础 ===================== */
const app = firebase.initializeApp(window.firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

function setAuthBadge(txt, ok=false){
  const b = document.getElementById('authBadge');
  b.textContent = 'Auth: ' + txt;
  b.style.borderColor = ok ? '#34d39980' : '#fb718580';
  b.style.color = ok ? '#34d399' : '#fb7185';
}

async function ensureAuth(){
  if (auth.currentUser){ setAuthBadge(auth.currentUser.uid.slice(0,8)+'…', true); return auth.currentUser; }
  try{
    const u = await auth.signInAnonymously();
    setAuthBadge(u.user.uid.slice(0,8)+'…', true);
    return u.user;
  }catch(e){
    console.error('Auth failed:', e);
    setAuthBadge('ERR', false);
    alert('登录失败：' + (e && e.message ? e.message : e));
    throw e;
  }
}

/* ===================== 会话保存 / 恢复 ===================== */
function saveSession(roomId, name){
  localStorage.setItem('lb_session', JSON.stringify({roomId, name, t:Date.now()}));
  localStorage.setItem('lb_lang', LANG);
}
async function tryAutoResume(){
  const savedStr = localStorage.getItem('lb_session');
  if (!savedStr) return false;
  const saved = JSON.parse(savedStr||'{}');
  if (!saved.roomId) return false;
  ROOM_ID = saved.roomId; me.name = saved.name || 'Player';
  const lobbyDoc = await roomRefs(ROOM_ID).lobby.get().catch(()=>null);
  if (!lobbyDoc || !lobbyDoc.exists) return false;

  const hUid = lobbyDoc.data().hostUid;
  isHost = (auth.currentUser && auth.currentUser.uid === hUid);

  if (isHost){
    const stDoc = await roomRefs(ROOM_ID).state.get().catch(()=>null);
    const st = (stDoc && stDoc.exists) ? stDoc.data() : {};
    H = {
      settings: lobbyDoc.data().settings || { seats:4, startHand:5, demon:false },
      players: (lobbyDoc.data().seats||[]).map(s=> s? { uid:s.uid, name:s.name, alive:s.alive!==false, rolls:s.rolls||[], rollMap:{}, hand:[] } : null),
      roundNo: st.roundNo||0, target: st.target||null, turn: st.turn||0,
      pot:[], awaitingReveal: st.awaitingReveal||false, challengerId:null, revealing:false,
      gameSeq: st.gameSeq||0
    };
    attachCommonListeners();
    attachHostActionListener();
  }else{
    attachCommonListeners();
  }
  enterLobbyUI();
  document.getElementById("roomShow").textContent = ROOM_ID;
  document.getElementById("roleShow").textContent = isHost ? t('roleHost') : t('roleGuest');
  document.getElementById("hostPanel").classList.toggle('hidden', !isHost);
  return true;
}

/* ===================== 全局与工具 ===================== */
let ROOM_ID = null;
let isHost = false;
let uid = null;
let me = { uid:null, name:"" };

function toast(msg){ const tdiv=document.getElementById('toast'); tdiv.firstElementChild.textContent=msg; tdiv.classList.remove('hidden'); setTimeout(()=>tdiv.classList.add('hidden'),1800); }

const TARGETS = ["A","Q","K"];
const rnd = n => Math.floor(Math.random()*n);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]];} return a; };

/* 根据本轮 target & 是否启用恶魔牌 生成牌堆 */
function makeCustomDeck(target, demonMode){
  const d=[];
  // target：5张普通 + 1张恶魔（若启用），否则 6 张普通
  if (demonMode){
    for(let i=0;i<5;i++) d.push({r:target});
    d.push({r:target, demon:true});
  }else{
    for(let i=0;i<6;i++) d.push({r:target});
  }
  // 另外两个点数各 6
  TARGETS.filter(x=>x!==target).forEach(x=>{ for(let i=0;i<6;i++) d.push({r:x}); });
  // Joker ×2
  d.push({r:"JOKER"},{r:"JOKER"});
  return shuffle(d);
}
const isMatch = (c, target) => c.r==="JOKER" || c.r===target; // 恶魔也是 target
function nextAliveFrom(state, idx){
  const n=state.players.length;
  for(let k=1;k<=n;k++){
    const j=(idx+k)%n;
    const pj=state.players[j];
    if (pj && pj.alive && (pj.hand?.length>0)) return j; // 没牌就跳过
  }
  return idx;
}
function activeWithCards(state){
  const arr=[];
  state.players.forEach((p,i)=>{ if(p && p.alive && p.hand && p.hand.length>0) arr.push(i); });
  return arr;
}
function mustLiarNow(state){
  if (!state.pot.length) return false;
  const last = state.pot[state.pot.length-1];
  const lastIdx = state.players.findIndex(p=>p && p.uid===last.by);
  if (lastIdx<0) return false;
  const lastEmpty = state.players[lastIdx].hand.length===0;
  if (!lastEmpty) return false;
  const actives = activeWithCards(state);
  return (actives.length===1 && actives[0]===state.turn);
}

function roomRefs(roomId){
  const room = db.collection('rooms').doc(roomId);
  return {
    room,
    lobby: room.collection('meta').doc('lobby'),
    state: room.collection('meta').doc('state'),
    actions: room.collection('actions'),
    events: room.collection('events'),
    hands: room.collection('hands'),
    chat: room.collection('chat'),
  };
}

/* ===================== Host 权威状态 ===================== */
let H = null;

async function hostInit(roomId, name){
  isHost = true; ROOM_ID = roomId; me.name = name;
  const user = await ensureAuth(); uid = user.uid; me.uid = uid;

  const { lobby } = roomRefs(ROOM_ID);

  H = {
    settings:{ seats:4, startHand:5, demon:false },
    players: new Array(4).fill(null),
    roundNo:0, target:null, turn:0,
    pot:[], awaitingReveal:false, challengerId:null,
    revealing:false, gameSeq:0
  };
  H.players[0] = { uid, name, alive:true, rolls:[], rollMap:{}, hand:[] };

  await lobby.set({
    hostUid: uid,
    settings: H.settings,
    seats: H.players.map(p=> p ? {uid:p.uid, name:p.name, alive:p.alive, rolls:p.rolls} : null),
    canStart: false,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
  });

  saveSession(ROOM_ID, name);
  attachCommonListeners();
  attachHostActionListener();
  enterLobbyUI();
  document.getElementById("roomShow").textContent = ROOM_ID;
  document.getElementById("roleShow").textContent = t('roleHost');
  document.getElementById("hostPanel").classList.remove('hidden');
}

async function guestJoin(roomId, name){
  isHost = false; ROOM_ID = roomId; me.name = name;
  const user = await ensureAuth(); uid = user.uid; me.uid = uid;
  saveSession(ROOM_ID, name);
  attachCommonListeners();
  enterLobbyUI();
  document.getElementById("roomShow").textContent = ROOM_ID;
  document.getElementById("roleShow").textContent = t('roleGuest');
  document.getElementById("hostPanel").classList.add('hidden');
}

/* ===================== Host 写入 ===================== */
async function writeLobby(){
  const { lobby } = roomRefs(ROOM_ID);
  const canStart = H.players.filter(p=>p && p.alive).length >= 2;
  await lobby.set({
    hostUid: uid,
    settings: H.settings,
    seats: H.players.map(p=> p ? {uid:p.uid, name:p.name, alive:p.alive, rolls:p.rolls} : null),
    canStart
  }, { merge:true });
}
async function writeState(withWinner=false){
  const { state } = roomRefs(ROOM_ID);
  const aliveNow = H.players.filter(p=>p && p.alive);
  const winner = withWinner ? (aliveNow.length<=1 ? (aliveNow[0]||null) : null) : null;
  const data = {
    roundNo: H.roundNo,
    gameSeq: H.gameSeq||0,
    target: H.target,
    turn: H.turn,
    awaitingReveal: H.awaitingReveal,
    lastClaim: H.pot.length? { by:H.pot[H.pot.length-1].by, count:H.pot[H.pot.length-1].cards.length } : null,
    pot: H.pot.map(b=>({ by: b.by, count: b.cards.length })), // 公共区只给数量
    players: H.players.map(p=> p ? {uid:p.uid,name:p.name,alive:p.alive, handCount:p.hand.length, rolls:p.rolls} : null),
    winner: winner ? {uid:winner.uid, name:winner.name} : null,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
  };
  await state.set(data);
}
async function sendHands(){
  const { hands } = roomRefs(ROOM_ID);
  for (const p of H.players){
    if (!p) continue;
    await hands.doc(p.uid).set({ ownerUid:p.uid, hand:p.hand });
  }
}
async function emitEvent(type, payload){
  const { events } = roomRefs(ROOM_ID);
  await events.add({ type, payload, ts: firebase.firestore.FieldValue.serverTimestamp() });
}

/* ===================== Host 游戏操作 ===================== */
async function hostApplySettings(){
  const newSeats = Math.max(2, Math.min(4, Number(document.getElementById("seatMax").value||4)));
  const startHand = Number(document.getElementById("startHand").value||5);
  const demon = !!document.getElementById("demonMode").checked;
  const oldSeats = H.players.length;
  let arr = new Array(newSeats).fill(null);
  for (let i=0; i<Math.min(oldSeats, newSeats); i++) arr[i] = H.players[i] || null;
  // 保证 Host 在 1 号位
  if (!arr[0] || arr[0].uid !== uid){
    const idx = (H.players||[]).findIndex(p=>p && p.uid===uid);
    const hostObj = idx>=0 ? H.players[idx] : { uid, name: me.name, alive:true, rolls:[], rollMap:{}, hand:[] };
    if (arr[0] && arr[0].uid !== uid){
      const firstEmpty = arr.findIndex(x=>x===null);
      if (firstEmpty >= 1) arr[firstEmpty] = arr[0];
    }
    arr[0] = hostObj;
  }
  H.players = arr;
  H.settings = { seats: newSeats, startHand, demon };
  await writeLobby();
}

async function hostStart(){
  const seated = H.players.filter(p=>p && p.alive);
  if (seated.length < 2){ toast(t('need2p')); return; }
  H.target = TARGETS[rnd(TARGETS.length)];
  const deck = makeCustomDeck(H.target, !!H.settings.demon);
  if (seated.length * H.settings.startHand > deck.length){ toast(t('notEnough')); return; }
  for (const p of H.players){
    if (p && p.alive){ p.hand = deck.splice(0, H.settings.startHand); p.sel = new Set(); }
    else if (p){ p.hand = []; }
  }
  H.gameSeq = (H.gameSeq||0) + 1; // 新一局
  H.roundNo = 1;
  H.turn = nextAliveFrom(H, -1);
  H.pot = []; H.awaitingReveal=false; H.challengerId=null; H.revealing=false;

  await sendHands();
  await writeLobby();
  await writeState();
  showSmoke();
}

async function hostNewGame(){
  // 保留座位，重置生存与骰史
  H.players = H.players.map(p => p ? { ...p, alive:true, rolls:[], rollMap:{}, hand:[] } : p);
  H.target  = TARGETS[rnd(TARGETS.length)];
  const deck = makeCustomDeck(H.target, !!H.settings.demon);
  const seated = H.players.filter(p=>p);
  if (seated.length * H.settings.startHand > deck.length) {
    H.settings.startHand = Math.max(1, Math.floor(deck.length / seated.length));
  }
  for (const p of H.players){ if (p) p.hand = deck.splice(0, H.settings.startHand); }

  H.gameSeq = (H.gameSeq||0) + 1;
  H.roundNo = 1;
  H.turn    = nextAliveFrom(H, -1);
  H.pot     = [];
  H.awaitingReveal = false;
  H.challengerId   = null;
  H.revealing      = false;

  await sendHands(); await writeLobby(); await writeState();
  showSmoke();
}

/* 玩家离开（移除座位；如果是当前手则推进回合） */
async function hostRemovePlayer(guestUid){
  const idx = H.players.findIndex(p=>p && p.uid===guestUid);
  if (idx < 0) return;
  const wasTurn = (H.turn === idx);
  H.players[idx] = null;
  if (wasTurn) H.turn = nextAliveFrom(H, idx);
  const alive = H.players.filter(p=>p && p.alive);
  if (alive.length <= 1){
    await writeState(true);
  }else{
    await writeLobby();
    await writeState();
  }
}

/* 退出房间（Host 解散房间） */
async function hostDisbandRoom(){
  try{
    const { room, lobby, state, actions, events, hands, chat } = roomRefs(ROOM_ID);
    for (const col of [actions, events, hands, chat]){
      const snap = await col.get();
      const batchSize = snap.size;
      if (batchSize){
        const batch = db.batch();
        snap.forEach(d=> batch.delete(d.ref));
        await batch.commit();
      }
    }
    await lobby.delete().catch(()=>{});
    await state.delete().catch(()=>{});
    await room.delete().catch(()=>{});
  }catch(e){
    console.warn('Disband error (ignored):', e);
  }
}

/* Host 接座/出牌/质疑/翻开 */
async function hostTakeSeat(seat, _uid, name){
  if (seat<0 || seat>=H.players.length) return;
  if (H.players[seat]) return;
  if (H.players.findIndex(p=>p && p.uid===_uid)>=0) return;
  H.players[seat] = { uid:_uid, name, alive:true, rolls:[], rollMap:{}, hand:[] };
  await writeLobby();
}

async function handsSetOne(uidX, hand){ const { hands } = roomRefs(ROOM_ID); await hands.doc(uidX).set({ ownerUid:uidX, hand }); }

async function hostPlay(_uid, indices){
  // 强制“必须质疑”的场景：禁止出牌
  if (mustLiarNow(H)) return;

  const seat = H.players.findIndex(p=>p && p.uid===_uid);
  if (seat !== H.turn) return;
  const p = H.players[seat]; if (!p || !p.alive) return;
  if (!Array.isArray(indices) || indices.length===0) return;

  // 恶魔牌只能单出
  const selCards = indices.map(i=>p.hand[i]);
  const hasDemon = selCards.some(c=>c && c.demon===true);
  if (hasDemon && indices.length!==1) return;

  const sorted = [...indices].sort((a,b)=>b-a);
  const cards=[]; for (const i of sorted){ if (i<0 || i>=p.hand.length) return; cards.push(p.hand.splice(i,1)[0]); }
  H.pot.push({by:p.uid, cards, declared:H.target});
  H.awaitingReveal=false; H.challengerId=null;

  // 下一个有牌的人（空手跳过）
  H.turn = nextAliveFrom(H, H.turn);

  await handsSetOne(p.uid, p.hand);
  await writeState();
}

async function hostLiar(_uid){
  // 只有“当前下家”可质疑
  if (H.players[H.turn]?.uid !== _uid) return;
  if (!H.pot.length) return;
  H.challengerId = _uid;
  H.awaitingReveal = true;
  H.revealing = false;
  lastReveal = null;
  await writeState();
}

const DICE_TURNS = 14, DICE_BASE = 70, DICE_INC = 35, DICE_HOLD = 1000;
function diceAnimMs(){ return (DICE_TURNS+1)*DICE_BASE + (DICE_TURNS*(DICE_TURNS+1)/2)*DICE_INC + DICE_HOLD; }

async function hostReveal(){
  if (!H.awaitingReveal || H.pot.length===0 || H.revealing) return;
  H.revealing = true;

  const last = H.pot[H.pot.length-1];
  lastReveal = last.cards.map(c=>({...c}));
  await emitEvent("REVEAL_VIEW", { cards:last.cards.map(c=>({...c})) });

  setTimeout(async ()=>{
    const truthful = last.cards.every(c=>isMatch(c, H.target));
    const loserId  = truthful ? H.challengerId : last.by;
    const winnerId = truthful ? last.by : H.challengerId;
    const loserSeat  = H.players.findIndex(p=>p && p.uid===loserId);
    const winnerSeat = H.players.findIndex(p=>p && p.uid===winnerId);
    if (loserSeat<0) { H.revealing=false; return; }

    // 是否恶魔牌触发群体掷骰
    const demonHit = last.cards.length===1 && last.cards[0].demon===true && !!H.settings.demon;

    // 组装要掷骰的队列
    let rollUids = [];
    if (demonHit){
      // 除出牌者外所有存活都掷一次
      rollUids = H.players.filter(p=>p && p.alive && p.uid!==last.by).map(p=>p.uid);
    }else{
      rollUids = [loserId];
    }

    // 顺序执行掷骰
    for (const uidX of rollUids){
      const seatX = H.players.findIndex(p=>p && p.uid===uidX);
      if (seatX<0) continue;
      const P = H.players[seatX];
      const roll = 1 + rnd(6);
      await emitEvent("DICE_ANIM", { who:P.name, value:roll });
      await new Promise(res=> setTimeout(res, diceAnimMs()));
      P.rolls.push(roll); P.rollMap[roll]=(P.rollMap[roll]||0)+1;
      const dieNow = (roll===6) || (P.rollMap[roll]>=2);
      if (dieNow){ P.alive=false; P.hand=[]; await handsSetOne(P.uid, P.hand); }
      await emitEvent("DICE_RESULT", { who:P.name, uid:P.uid, value:roll, died:dieNow });
      await new Promise(res=> setTimeout(res, 300));
    }

    // 选择下个回合起手：以 liar 胜者作为先手（即 winnerSeat），若其已死则找下一个有牌存活者
    const startIndex = (winnerSeat>=0 && H.players[winnerSeat]?.alive && (H.players[winnerSeat].hand.length>0))
      ? winnerSeat : nextAliveFrom(H, loserSeat);

    setTimeout(async ()=>{
      await redealFrom(startIndex);
      H.revealing = false;
    }, 800);
  }, 3000);
}

async function redealFrom(startIndex){
  H.awaitingReveal = false;
  H.revealing = false;
  const alive = H.players.filter(p=>p && p.alive);
  if (alive.length<=1){ await writeState(true); return; }

  H.target = TARGETS[rnd(TARGETS.length)];
  const deck = makeCustomDeck(H.target, !!H.settings.demon);

  // 本轮只给“仍有玩家（存活）”发起始手
  const recipients = H.players.filter(p=>p && p.alive);
  const need = recipients.length * H.settings.startHand;
  if (need > deck.length){
    H.settings.startHand = Math.max(1, Math.floor(deck.length / recipients.length));
  }
  for (const p of H.players){
    if (p && p.alive) p.hand = deck.splice(0,H.settings.startHand);
    else if (p) p.hand=[];
  }
  H.pot=[]; 
  H.roundNo = (H.roundNo||0)+1;
  H.turn = nextAliveFrom(H, startIndex-1);
  H.awaitingReveal=false; H.challengerId=null;
  lastReveal = null; lastTurnUid = null;

  await sendHands();
  await writeLobby();
  await writeState();
  showSmoke();
}

/* 返回大厅（不解散房间） */
async function hostBackToLobbyReset(){
  H.roundNo = 0; H.pot=[]; H.awaitingReveal=false; H.challengerId=null; H.revealing=false;
  H.target=null; H.turn=0;
  H.players.forEach(p=>{ if(p){ p.alive=true; p.rolls=[]; p.rollMap={}; p.hand=[]; }});
  await sendHands();
  await writeLobby();
  await writeState();
  enterLobbyUI();
}

/* ===================== Host 监听 actions ===================== */
let unsubActions = null;
function attachHostActionListener(){
  const { actions } = roomRefs(ROOM_ID);
  if (unsubActions) unsubActions();

  unsubActions = actions.orderBy('ts').limitToLast(100).onSnapshot(async (qs)=>{
    for (const ch of qs.docChanges()){
      if (ch.type !== 'added') continue;
      const doc = ch.doc; const a = doc.data()||{};
      if (a.processed) continue;

      try{
        switch(a.type){
          case 'TAKE_SEAT':    await hostTakeSeat(a.seat, a.uid, a.name); break;
          case 'LEAVE_SEAT':   await hostRemovePlayer(a.uid); break;
          case 'LEAVE_ROOM':   await hostRemovePlayer(a.uid); break;
          case 'PLAY':         await hostPlay(a.uid, a.indices); break;
          case 'LIAR':         await hostLiar(a.uid); break;
          case 'REVEAL':       await hostReveal(); break;
          case 'HOST_APPLY':   if (a.uid===uid) await hostApplySettings(); break;
          case 'HOST_START':   if (a.uid===uid) await hostStart(); break;
          case 'HOST_NEW_GAME':if (a.uid===uid) await hostNewGame(); break;
          case 'BACK_TO_LOBBY': await hostBackToLobbyReset(); break;
        }
      } finally {
        await doc.ref.update({ processed:true, processedBy: uid });
      }
    }
  }, err=>{
    console.error('Actions listener error:', err);
    alert('Host 监听错误：' + (err && err.message ? err.message : err));
  });
}

/* ===================== 公用监听（含聊天） ===================== */
let unsubLobby=null, unsubState=null, unsubEvents=null, unsubMyHand=null, unsubChat=null;
let L=null, S=null, myHand=[], myHandHash="";
let lastReveal=null, lastTurnUid=null;

function attachCommonListeners(){
  const { lobby, state, events, hands } = roomRefs(ROOM_ID);

  if (unsubLobby) unsubLobby();
  unsubLobby = lobby.onSnapshot((doc)=>{
    if (!doc.exists) return;
    L = doc.data();

    const imHost = (L.hostUid === (auth.currentUser && auth.currentUser.uid));
    isHost = imHost;
    document.getElementById("hostPanel").classList.toggle("hidden", !isHost);

    renderLobbyLocal(L);
    document.getElementById("roomShow").textContent = ROOM_ID;
    document.getElementById("roleShow").textContent = isHost ? t('roleHost') : t('roleGuest');
    const btn = document.getElementById("btnStart"); if (btn && isHost) btn.disabled = !L.canStart;
    // 游戏内 Host 控件
    document.getElementById('btnHostNewGame').classList.toggle('hidden', !isHost);
    document.getElementById('btnHostToLobby').classList.toggle('hidden', !isHost);
  }, err=>{
    console.error('Lobby listen error:', err);
    alert('读取大厅失败：' + (err && err.message ? err.message : err));
  });

  if (unsubState) unsubState();
  unsubState = state.onSnapshot((doc)=>{
    if (!doc.exists) return;
    const prevGameSeq = S?.gameSeq;
    S = doc.data();
    // 若 gameSeq 变化，重绑聊天监听 & 清空列表
    if (prevGameSeq !== S.gameSeq){
      detachChat();
      attachChat();
      const chatList = document.getElementById('chatList');
      if (chatList) chatList.innerHTML = '';
    }
    renderAll();
  }, err=>{
    console.error('State listen error:', err);
    alert('读取游戏状态失败：' + (err && err.message ? err.message : err));
  });

  if (unsubEvents) unsubEvents();
  unsubEvents = events.orderBy('ts').limitToLast(50).onSnapshot((qs)=>{
    qs.docChanges().forEach(ch=>{
      if (ch.type !== 'added') return;
      const e = ch.doc.data();
      if (!e || !e.type) return;
      switch(e.type){
        case "REVEAL_VIEW":
          lastReveal = e.payload?.cards||[];
          toast(LANG==='zh' ? "正在翻开最近一次出牌…" : "Revealing last batch…");
          renderAll();
          break;
        case "DICE_ANIM":
          showDice(e.payload?.value||1, e.payload?.who||'');
          break;
        case "DICE_RESULT":
          showRollBanner(e.payload?.uid, e.payload?.who, e.payload?.value, e.payload?.died);
          break;
      }
    });
  }, err=>{
    console.error('Events listen error:', err);
  });

  if (unsubMyHand) unsubMyHand();
  unsubMyHand = hands.doc(auth.currentUser.uid).onSnapshot((doc)=>{
    if (!doc.exists) return;
    const h = doc.data()?.hand || [];
    const newHash = h.map(c=> (c.demon?'*':'') + c.r ).join('|');
    if (newHash !== myHandHash){
      myHand = h; myHandHash = newHash;
      selectedIndices.clear();
      renderAll();
    }
  }, err=>{
    console.error('Hand listen error:', err);
  });

  // 首次绑定聊天
  attachChat();
}

function detachAll(){
  unsubLobby && unsubLobby(); unsubLobby=null;
  unsubState && unsubState(); unsubState=null;
  unsubEvents && unsubEvents(); unsubEvents=null;
  unsubMyHand && unsubMyHand(); unsubMyHand=null;
  detachChat();
}
function detachChat(){
  unsubChat && unsubChat(); unsubChat=null;
}

/* 聊天：按 clientAt 升序渲染，避免重复、主从一致 */
function attachChat(){
  const wrap = document.getElementById('chatWrap');
  if (!ROOM_ID || !S){ if(wrap) wrap.classList.add('hidden'); return; }
  const { chat } = roomRefs(ROOM_ID);
  const list = document.getElementById('chatList');
  if (!list) return;

  wrap.classList.remove('hidden');
  if (unsubChat) unsubChat();

  unsubChat = chat.where('gameSeq','==', S.gameSeq||0).orderBy('clientAt','asc').limit(500).onSnapshot((qs)=>{
    list.innerHTML = '';
    qs.forEach(doc=>{
      const m = doc.data();
      const div = document.createElement('div');
      div.className = 'chat-item' + ((m.uid === (auth.currentUser && auth.currentUser.uid)) ? ' chat-me' : '');
      div.textContent = `${m.name||'??'}: ${m.text||''}`;
      list.appendChild(div);
    });
    list.scrollTop = list.scrollHeight;
  }, err=>{
    console.error('chat listen error:', err);
  });
}

/* ===================== 事件发送（确保登录 + 报错提示） ===================== */
async function sendAction(data){
  try{
    await ensureAuth();
    if (!uid) uid = auth.currentUser.uid;
    const { actions } = roomRefs(ROOM_ID);
    return await actions.add({
      ...data,
      uid, name: me.name,
      ts: firebase.firestore.FieldValue.serverTimestamp(),
      processed:false
    });
  }catch(e){
    console.error('sendAction failed:', e);
    alert('发送动作失败：' + (e && e.message ? e.message : e));
    throw e;
  }
}
async function sendChatMsg(text){
  if (!text || !ROOM_ID || !S) return;
  const { chat } = roomRefs(ROOM_ID);
  await chat.add({
    uid: auth.currentUser.uid, name: me.name, text: String(text).slice(0,400),
    gameSeq: S.gameSeq||0,
    clientAt: Date.now(),
    ts: firebase.firestore.FieldValue.serverTimestamp()
  });
}

/* ===================== UI：渲染 ===================== */
function enterLobbyUI(){ document.getElementById("connect").classList.add("hidden"); document.getElementById("game").classList.add("hidden"); document.getElementById("lobby").classList.remove("hidden"); }
function enterGameUI(){ document.getElementById("lobby").classList.add("hidden"); document.getElementById("game").classList.remove("hidden"); }

function renderLobbyLocal(lobby){
  applyStaticTexts();
  const seats = document.getElementById("seats"); seats.innerHTML="";

function renderAll(){
  if (!S) return;
  if (!S.awaitingReveal) lastReveal = null;

  const winnerWrap = document.getElementById("winnerWrap");
  if (S.winner){
    document.getElementById("winnerName").textContent = S.winner.name;
    winnerWrap.classList.remove("hidden");
    const ng = document.getElementById('btnNewGame');
    if (ng) ng.classList.toggle('hidden', !isHost);
    launchConfetti();
  } else {
    winnerWrap.classList.add("hidden");
  }

  enterGameUI();
  document.getElementById("roundNo").textContent = S.roundNo||1;
  document.getElementById("targetRank").textContent = S.target||"-";
  const currentSeat = S.turn;
  const currentPlayer = S.players[currentSeat];
  document.getElementById("currentPlayer").textContent = currentPlayer ? currentPlayer.name : "-";
  document.getElementById("roomIdInGame").textContent = ROOM_ID||'-';

  const row = document.getElementById("playersRow"); row.innerHTML="";
  S.players.forEach((p,i)=>{
    if (p===null) return;
    const wrap = document.createElement('div');
    const isTurn = (i===currentSeat);
    wrap.className = "rounded-xl p-3 border " + (isTurn?"border-sky-400/60":"border-[#334155] bg-[#0b142a]");
    wrap.dataset.uid = p.uid || '';
    if (!p.alive) wrap.classList.add("dead");
    const rollsTxt = p.rolls?.length ? p.rolls.join(", ") : "—";
    wrap.innerHTML = `
      <div class="flex items-center justify-between">
        <div class="font-semibold">${p.name}</div>
        <div class="text-sm opacity-80">${t('handCount', p.handCount)}</div>
      </div>
      <div class="flex items-center gap-2 text-sm flex-wrap mt-1">
        <span class="badge">${t('diceList', rollsTxt)}</span>
        ${p.alive ? '' : `<span class="badge" style="border-color:#fb7185;color:#fb7185">${t('eliminated')}</span>`}
        ${isTurn && p.alive ? `<span class="badge" style="border-color:#818cf8;color:#a5b4fc">${t('playing')}</span>` : ''}
      </div>
      <div class="roll-banner-area"></div>
    `;
    row.appendChild(wrap);
  });

  const potDiv = document.getElementById("pot"); potDiv.innerHTML="";
  if (S.pot.length){
    const revealMode = !!S.awaitingReveal;
    const batches = revealMode ? [ S.pot[S.pot.length-1] ] : S.pot;

    batches.forEach((batch, idx)=>{
      const rowDiv = document.createElement('div'); rowDiv.className = "flex items-center gap-3 mb-2 flex-wrap";
      const who = (S.players.find(x=>x && x.uid===batch.by)||{}).name || t('unknown');
      rowDiv.innerHTML = `<span class="text-sm opacity-90 px-2 py-1 rounded bg-[#0b142a] border border-[#334155]">${t('claim', who, S.target, batch.count)}</span>`;

      const cards = document.createElement('div'); cards.className="flex flex-wrap";
      const isRevealBatch = revealMode && idx===batches.length-1 && lastReveal;

      for(let k=0;k<batch.count;k++){
        const holder=document.createElement('div'); holder.className="card";
        const inner=document.createElement('div'); inner.className="inner";
        if (isRevealBatch && lastReveal[k]){
          const r = lastReveal[k].r;
          inner.innerHTML = cardFrontHTML(r)+cardBackHTML();
          if (r==="JOKER") holder.classList.add('joker');
          if (lastReveal[k].demon) holder.classList.add('demon');
          holder.classList.add('face-back','revealable');
        } else {
          inner.innerHTML = cardFrontHTML('?')+cardBackHTML();
          holder.classList.add('face-back');
        }
        holder.appendChild(inner);
        cards.appendChild(holder);
      }
      rowDiv.appendChild(cards); potDiv.appendChild(rowDiv);
    });

    if (S.awaitingReveal && lastReveal){
      requestAnimationFrame(()=>{ document.querySelectorAll('#pot .revealable.face-back').forEach(h=>{ h.classList.remove('face-back'); }); });
    }
  }
  document.getElementById("lastClaim").textContent = S.lastClaim ? t('recent', (S.players.find(p=>p&&p.uid===S.lastClaim.by)||{}).name||t('unknown'), S.lastClaim.count) : "—";
  if (S.lastClaim) potFlashOnce();

  const amIturn = (currentPlayer && currentPlayer.uid===auth.currentUser.uid && currentPlayer.alive);
  const prevBy = S.lastClaim ? S.lastClaim.by : null;

  // liar：只给“下家”且上家刚出过牌，且不在翻牌
  const liarBtn = document.getElementById("btnLiar");
  const mustL = mustLiarNow({ ...H, ...S, players: (H?H.players:[])}); // 使用 Host 的手牌信息判断空手
  const canLiar = amIturn && !S.awaitingReveal && S.pot.length>0 && prevBy && prevBy!==auth.currentUser.uid;
  liarBtn.disabled = !(canLiar);
  liarBtn.classList.toggle('hidden', !canLiar);
  if (mustL && amIturn){ liarBtn.disabled = false; liarBtn.classList.remove('hidden'); }

  // reveal：进入质疑后，只允许“下家/质疑者”（当前轮到）操作
  const revealBtn = document.getElementById("btnReveal");
  const canReveal = S.awaitingReveal && amIturn;
  revealBtn.classList.toggle("hidden", !canReveal);
  revealBtn.disabled = !canReveal;

  // 出牌按钮：当前轮到且有手牌且不在翻牌；若“必须质疑”则不可出
  const playBtn = document.getElementById("btnPlay");
  playBtn.disabled = S.awaitingReveal || !amIturn || (myHand.length===0) || (mustL && amIturn);

  document.getElementById("yourTurnTag").classList.toggle("hidden", !amIturn);

  const nowTurnUid = currentPlayer ? currentPlayer.uid : null;
  if (nowTurnUid === (auth.currentUser && auth.currentUser.uid) && lastTurnUid !== (auth.currentUser && auth.currentUser.uid)){ toast(t('toastTurn')); }
  lastTurnUid = nowTurnUid;

  renderHandOnly();
}

function glyphFor(r){ switch(r){ case 'A': return '✪'; case 'K': return '♚'; case 'Q': return '👑'; case 'JOKER': return '🃏'; default: return ''; } }
function cardFrontHTML(r){ return `<div class="front">${r!=='?'?`<span class="rank">${r==='JOKER'?'JK':r}</span><span class="glyph">${glyphFor(r)}</span>`:'<span class="rank">?</span>'}</div>`; }
function cardBackHTML(){ return `<div class="back">🂠</div>`; }

function diceSVG(n){
  const spots = {
    1:[[50,50]], 2:[[25,25],[75,75]], 3:[[25,25],[50,50],[75,75]],
    4:[[25,25],[25,75],[75,25],[75,75]],
    5:[[25,25],[25,75],[50,50],[75,25],[75,75]],
    6:[[25,25],[25,50],[25,75],[75,25],[75,50],[75,75]]
  }[n]||[[50,50]];
  return `<svg viewBox="0 0 100 100" width="64" height="64" xmlns="http://www.w3.org/2000/svg">
    <rect x="6" y="6" width="88" height="88" rx="16" fill="#0b1224" stroke="#93c5fd" stroke-opacity=".55"/>
    ${spots.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="6" fill="#e5ecff"/>`).join('')}
  </svg>`;
}
function showDice(finalValue, who){
  const layer = document.getElementById('diceLayer');
  const box = document.getElementById('diceBox');
  layer.classList.remove('hidden');
  box.classList.add('spin');

  const rolls = [];
  for (let i=0;i<DICE_TURNS;i++) rolls.push(1 + Math.floor(Math.random()*6));
  rolls.push(finalValue);

  let delay = 0;
  rolls.forEach((val, i) => {
    delay += DICE_BASE + i * DICE_INC;
    setTimeout(()=>{
      box.innerHTML = diceSVG(val) + (who ? `<div style="margin-top:8px; font-size:14px; opacity:.9">${who}</div>` : '');
      if (i === rolls.length - 1) {
        box.classList.remove('spin');
        setTimeout(()=> layer.classList.add('hidden'), DICE_HOLD);
      }
    }, delay);
  });
}
function showSmoke(){
  const layer = document.getElementById('smokeLayer');
  layer.innerHTML = '';
  layer.classList.remove('hidden');
  const count = 36;
  for (let i=0;i<count;i++){
    const s = document.createElement('div');
    s.className = 'puff';
    const left = Math.random()*100;
    const delay = Math.random()*0.8;
    const dur = 2.2 + Math.random()*1.2;
    const drift = (-30 + Math.random()*60) + 'vw';
    s.style.left = `calc(${left}vw - 60px)`;
    s.style.animationDuration = `${dur}s`;
    s.style.animationDelay = `${delay}s`;
    s.style.setProperty('--x', drift);
    layer.appendChild(s);
  }
  setTimeout(()=>layer.classList.add('hidden'), 3000);
}
function launchConfetti(){
  const colors = ['#f472b6','#60a5fa','#fbbf24','#34d399','#a78bfa','#f87171','#22d3ee'];
  const n = 120;
  for (let i=0;i<n;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    const x = Math.random()*100;
    const tx = (Math.random()*60 - 30) + 'vw';
    const rot = (Math.random()*720 - 360) + 'deg';
    const dur = 1.6 + Math.random()*1.2;
    c.style.left = x+'vw';
    c.style.background = `linear-gradient(180deg, ${colors[Math.floor(Math.random()*colors.length)]}, #fff0)`;
    c.style.setProperty('--tx', tx);
    c.style.setProperty('--rot', rot);
    c.style.animationDuration = dur + 's';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), dur*1000);
  }
}
function potFlashOnce(){ const felt = document.getElementById('felt'); felt.classList.add('pot-flash'); setTimeout(()=>felt.classList.remove('pot-flash'), 550); }

function showRollBanner(playerUid, name, value, died){
  const card = document.querySelector(`#playersRow [data-uid="${playerUid}"] .roll-banner-area`);
  if (!card) return;
  card.innerHTML = `<div class="roll-banner">${i18n[LANG].rollBanner(name, value, died)}</div>`;
  setTimeout(()=>{ card.innerHTML=""; }, 1200);

const selectedIndices = new Set();
function renderHandOnly(){
  const handDiv = document.getElementById("hand"); if (!handDiv) return;

  (myHand||[]).forEach((card, idx)=>{
    const holder=document.createElement('div'); holder.className="card"+(card.r==="JOKER"?" joker":"")+(card.demon?" demon":"")+(sel.has(idx)?" sel":"");
    const inner=document.createElement('div'); inner.className="inner";

      document.getElementById("btnPlay").textContent = t('play', sel.size);
      holder.classList.toggle("sel");
    };
    handDiv.appendChild(holder);
  });
  document.getElementById("btnPlay").textContent = t('play', sel.size);
}

};
document.getElementById("btnJoin").onclick = async ()=>{
  const name = (document.getElementById("nick").value||"Player").trim();
  const rid = (document.getElementById("roomInput").value||"").trim();
  if (!rid) return alert(LANG==='zh' ? "请输入房间号" : "Enter room ID");
  ROOM_ID = rid; await guestJoin(rid, name);
  applyStaticTexts();
};

document.getElementById("btnExitRoom").onclick = leaveRoomLocal;

async function applySettingsLocal(){ if (!isHost) return; await hostApplySettings(); }
async function startLocal(){ if (!isHost) return; await hostStart(); }

document.getElementById("seatMax").addEventListener("change", applySettingsLocal);
document.getElementById("startHand").addEventListener("change", applySettingsLocal);
document.getElementById("demonMode").addEventListener("change", applySettingsLocal);
document.getElementById("btnStart").onclick = startLocal;

/* 游戏内 Host 新一局按钮 */
document.getElementById("btnHostNewGame").onclick = async ()=>{
  if (isHost) await hostNewGame(); else await sendAction({ type:'HOST_NEW_GAME' });
};
/* 游戏中 Host 返回大厅（所有人回大厅） */
document.getElementById("btnHostToLobby").onclick = async ()=>{
  if (isHost) await hostBackToLobbyReset(); else await sendAction({ type:'BACK_TO_LOBBY' });
};

/* 胜利弹窗 */
document.getElementById("btnNewGame").onclick = async ()=>{
  document.getElementById("winnerWrap").classList.add("hidden");
  if (isHost) { await hostNewGame(); }
  else { await sendAction({ type:'HOST_NEW_GAME' }); }
};
document.getElementById("btnBackLobby").onclick = async ()=>{
  document.getElementById("winnerWrap").classList.add("hidden");
  if (isHost) await hostBackToLobbyReset(); else await sendAction({ type:'BACK_TO_LOBBY' });
};

document.getElementById("btnPlay").onclick = async ()=>{
  if (selectedIndices.size===0) return toast(t('needOne'));
  const handDiv = document.getElementById("hand");
  const idxs = Array.from(selectedIndices).sort((a,b)=>a-b);
  idxs.forEach(i=>{
    const el = handDiv.children[i];
    if (el) el.classList.add('burst');
  });
  document.getElementById("btnPlay").disabled = true;
  setTimeout(async ()=>{
    await sendAction({ type:'PLAY', indices: idxs });
    selectedIndices.clear();
    document.getElementById("btnPlay").textContent = t('play', 0);
    document.getElementById("btnPlay").disabled = false;
  }, 180);
};

document.getElementById("btnLiar").onclick = async ()=>{
  const felt = document.getElementById("felt");
  felt.classList.add('shake'); setTimeout(()=> felt.classList.remove('shake'), 420);
  if (navigator.vibrate) { try{ navigator.vibrate([80, 40, 120]); }catch{} }
  await sendAction({ type:'LIAR' });
};

document.getElementById("btnReveal").onclick = async ()=>{
  const br = document.getElementById("btnReveal");
  br.disabled = true;
  try { await sendAction({ type:'REVEAL' }); }
  finally { setTimeout(()=>{ br.disabled = false; }, 5000); }
};

document.getElementById("langSel").addEventListener("change", (e)=>{
  LANG = e.target.value;
  localStorage.setItem('lb_lang', LANG);
  applyStaticTexts();
  if (L) renderLobbyLocal(L);
  if (S) renderAll();
});

/* 聊天发送：只靠快照渲染，避免重复 */
document.getElementById("btnSendChat").onclick = async ()=>{
  const inp = document.getElementById('chatInput');
  const txt = (inp.value||'').trim();
  if (!txt) return;
  await sendChatMsg(txt);
  inp.value='';
};

ensureAuth()
  .then(()=> tryAutoResume())
  .catch(()=>{})
  .finally(()=> applyStaticTexts());
</script>
