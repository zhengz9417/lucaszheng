<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>Liar’s Bar – Host/Join（修复：胜者先手 + 回合提示 + 回大厅 + 取消轮询避免选择被清）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .card{display:inline-flex;align-items:center;justify-content:center;width:56px;height:80px;margin:4px;border-radius:12px;border:1px solid #cbd5e1;background:#fff;color:#111827;font-weight:700;transition:transform .15s ease;user-select:none}
    .card.sel{outline:3px solid #6366F1;transform:translateY(-4px)}
    .card.joker{background:repeating-linear-gradient(45deg,#fff,#fff 6px,#f8fafc 6px,#f8fafc 12px)}
    .badge{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid #cbd5e1}
    .dead{opacity:.45;filter:grayscale(.4)}
  </style>
</head>
<body class="bg-slate-100 min-h-screen">
  <div class="max-w-6xl mx-auto p-4 md:p-6">
    <header class="flex items-center justify-between mb-4">
      <h1 class="text-2xl md:text-3xl font-bold">Liar’s Bar – Host / Join</h1>
      <button id="btnResetAll" class="px-3 py-2 rounded-lg bg-slate-800 text-white hover:bg-slate-700">刷新页面</button>
    </header>

    <!-- Connect -->
    <section id="connect" class="bg-white rounded-2xl shadow p-4 md:p-6">
      <h2 class="text-xl font-semibold mb-3">进入或创建房间</h2>
      <div class="grid md:grid-cols-2 gap-4">
        <div class="space-y-2">
          <label class="block text-sm">你的昵称</label>
          <input id="nick" class="w-full border rounded-lg p-2" placeholder="例如：Lucas" />
        </div>
        <div class="space-y-2">
          <label class="block text-sm">房间号（加入时填写）</label>
          <input id="roomInput" class="w-full border rounded-lg p-2" placeholder="例如：ABCD1" />
        </div>
      </div>
      <div class="mt-4 flex flex-wrap gap-3">
        <button id="btnCreate" class="px-4 py-2 rounded-lg bg-indigo-600 text-white">我是主机（创建房间）</button>
        <button id="btnJoin" class="px-4 py-2 rounded-lg bg-emerald-600 text-white">加入房间</button>
      </div>
      <p class="text-slate-500 text-sm mt-3">当前为本地原型（BroadcastChannel），多开标签页即可联机测试。</p>
    </section>

    <!-- Lobby -->
    <section id="lobby" class="hidden bg-white rounded-2xl shadow p-4 md:p-6 mt-6">
      <div class="flex items-center justify-between flex-wrap gap-3">
        <div>
          <h2 class="text-xl font-semibold">房间大厅</h2>
          <div class="text-slate-600 text-sm">房间号：<span id="roomShow" class="font-mono px-2 py-1 bg-slate-100 rounded"></span></div>
          <div class="text-slate-600 text-sm">我的身份：<span id="roleShow" class="font-semibold"></span></div>
        </div>
        <div id="hostPanel" class="hidden flex items-center gap-3">
          <div class="flex items-center gap-2">
            <label class="text-sm">座位数（2–4）</label>
            <select id="seatMax" class="border rounded-lg p-2"><option>2</option><option>3</option><option selected>4</option></select>
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm">起始手牌</label>
            <input id="startHand" type="number" min="3" max="9" value="5" class="w-20 border rounded-lg p-2"/>
          </div>
          <button id="btnApply" class="px-3 py-2 rounded-lg bg-slate-700 text-white">应用设置</button>
          <button id="btnStart" class="px-3 py-2 rounded-lg bg-indigo-600 text-white" disabled>开始游戏</button>
          <button id="btnHostRestart" class="px-3 py-2 rounded-lg bg-amber-600 text-white">重开</button>
        </div>
      </div>

      <div id="seats" class="mt-4 grid grid-cols-2 md:grid-cols-4 gap-4"></div>
      <p class="text-slate-500 text-sm mt-2">提示：点击空位即可入座；Host 调整座位数会出现/隐藏位置。</p>
    </section>

    <!-- Game -->
    <section id="game" class="hidden bg-white rounded-2xl shadow p-4 md:p-6 mt-6">
      <div class="flex flex-wrap items-center gap-2 mb-4">
        <span class="badge">回合：<b id="roundNo"></b></span>
        <span class="badge">目标：<b id="targetRank" class="text-indigo-600"></b></span>
        <span class="badge">当前：<b id="currentPlayer" class="text-emerald-600"></b></span>
        <span id="yourTurnTag" class="badge hidden" style="border-color:#10b981;color:#059669">你的回合</span>
      </div>

      <div id="playersRow" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3 mb-4"></div>

      <div class="bg-slate-50 rounded-xl p-3 mb-4 border">
        <div class="flex items-center justify-between">
          <h3 class="font-semibold">桌面</h3>
          <div id="lastClaim" class="text-sm text-slate-600"></div>
        </div>
        <div id="pot" class="mt-2"></div>
      </div>

      <div class="grid md:grid-cols-3 gap-4">
        <div class="md:col-span-2">
          <h3 class="font-semibold mb-2">我的手牌（点击选择任意张）</h3>
          <div id="hand" class="min-h-[92px]"></div>
        </div>
        <div class="md:col-span-1">
          <h3 class="font-semibold mb-2">操作</h3>
          <div class="flex flex-wrap gap-2">
            <button id="btnPlay" class="px-4 py-2 rounded-lg bg-indigo-600 text-white disabled:opacity-50">出牌（0）</button>
            <button id="btnLiar" class="px-4 py-2 rounded-lg bg-rose-600 text-white">质疑（LIAR!）</button>
            <button id="btnReveal" class="px-4 py-2 rounded-lg bg-amber-500 text-white hidden">翻开判定</button>
          </div>
          <p class="text-slate-500 text-sm mt-2">只翻最近一次出牌，3 秒后判定；失败者掷骰（6 即死 / 同点第二次死亡）。</p>
        </div>
      </div>

      <div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-6 hidden">
        <div class="bg-black/80 text-white px-4 py-2 rounded-full shadow">提示</div>
      </div>

      <div id="winnerWrap" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl p-6 max-w-md w-full text-center">
          <h3 class="text-xl font-bold mb-2">胜利！</h3>
          <p class="mb-4"><span id="winnerName" class="font-semibold"></span> 获得胜利 🎉</p>
          <div class="flex items-center justify-center gap-2">
            <button id="btnBackLobby" class="px-4 py-2 rounded-lg bg-slate-700 text-white">返回大厅</button>
          </div>
        </div>
      </div>
    </section>
  </div>

<script>
/** ===== Transport / Globals ===== **/
let ROOM_ID = null;
let bc = null;
const uid = crypto.randomUUID();
let me = { uid, name: "" };
let isHost = false;
function post(msg){ bc && bc.postMessage(msg); }
function toast(msg){ const t=document.getElementById('toast'); t.firstElementChild.textContent=msg; t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'),1600); }

// Deck helpers (2 Jokers + 6×A/Q/K)
const TARGETS = ["A","Q","K"];
const rnd = n => Math.floor(Math.random()*n);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]];} return a; };
function makeCustomDeck(){ const d=[]; d.push({r:"JOKER"},{r:"JOKER"}); for(let i=0;i<6;i++){d.push({r:"A"},{r:"Q"},{r:"K"});} return shuffle(d); }
const cardText = c => c.r==="JOKER" ? "JOKER" : c.r;
const isMatch = (c, target) => c.r==="JOKER" || c.r===target;
function nextAliveFrom(state, idx){ const n=state.players.length; for(let k=1;k<=n;k++){const j=(idx+k)%n; if(state.players[j] && state.players[j].alive) return j;} return idx; }

/** ===== Host authoritative state ===== **/
let H = null;
/* host init */
function hostInit(roomId, name){
  isHost = true; ROOM_ID = roomId; me.name = name;
  openChannel();
  H = {
    roomId: ROOM_ID,
    settings:{ seats:4, startHand:5 },
    players: new Array(4).fill(null),
    roundNo:0, target:null, turn:0,
    pot:[], awaitingReveal:false, challengerId:null,
  };
  // Host 占 0 号位
  H.players[0] = { uid: me.uid, name: me.name, alive:true, rolls:[], rollMap:{}, hand:[] };
  broadcastLobby();
}
/* guest join */
function guestJoin(roomId, name){
  isHost = false; ROOM_ID = roomId; me.name = name;
  openChannel();
  post({t:"HELLO", from: uid, name });
}
/* open channel + show lobby */
function openChannel(){
  bc = new BroadcastChannel("liars:"+ROOM_ID);
  bc.onmessage = (ev)=>handleMessage(ev.data||{});
  enterLobbyUI();
  document.getElementById("roomShow").textContent = ROOM_ID;
  document.getElementById("roleShow").textContent = isHost ? "Host" : "Guest";
  document.getElementById("hostPanel").classList.toggle("hidden", !isHost);
}

/** ===== Host controls ===== **/
function hostApplySettings(){
  const newSeats = Math.max(2, Math.min(4, Number(document.getElementById("seatMax").value||4)));
  const startHand = Number(document.getElementById("startHand").value||5);
  const oldSeats = H.players.length;
  let arr = new Array(newSeats).fill(null);
  for (let i=0; i<Math.min(oldSeats, newSeats); i++) arr[i] = H.players[i] || null;
  // Host 保证在 0 号位
  if (!arr[0] || arr[0].uid !== me.uid){
    const idx = (H.players||[]).findIndex(p=>p && p.uid===me.uid);
    const hostObj = idx>=0 ? H.players[idx] : { uid: me.uid, name: me.name, alive:true, rolls:[], rollMap:{}, hand:[] };
    if (arr[0] && arr[0].uid !== me.uid){
      const firstEmpty = arr.findIndex(x=>x===null);
      if (firstEmpty >= 1) arr[firstEmpty] = arr[0];
    }
    arr[0] = hostObj;
  }
  H.players = arr;
  H.settings = { seats: newSeats, startHand };
  broadcastLobby();
}
function hostStart(){
  const seated = H.players.filter(p=>p && p.alive);
  if (seated.length < 2){ toast("至少需要 2 名玩家入座"); return; }
  const deck = makeCustomDeck();
  if (seated.length * H.settings.startHand > deck.length){ toast("牌不够，请调小起始手牌或座位数"); return; }

  for (const p of H.players){
    if (p && p.alive){ p.hand = deck.splice(0, H.settings.startHand); p.sel = new Set(); }
    else if (p){ p.hand = []; }
  }
  H.roundNo = (H.roundNo||0) + 1;
  H.target = TARGETS[rnd(TARGETS.length)];
  H.turn = H.players.findIndex(p=>p && p.alive);
  H.pot = []; H.awaitingReveal=false; H.challengerId=null;

  // 先让主机本地看到自己的手牌
  if (isHost){
    const hostSeat = H.players.findIndex(p=>p && p.uid===me.uid);
    if (hostSeat >= 0){ myHand = H.players[hostSeat].hand.slice(); myHandHash = hashHand(myHand); renderHandOnly(); }
  }

  // 先把各自手牌发给对应玩家，再广播状态
  sendHands();
  lastTurnUid = null; // 重置回合提示
  broadcastState();
}
function hostRestart(){
  H.roundNo = 0; H.pot=[]; H.awaitingReveal=false; H.challengerId=null;
  H.players.forEach(p=>{ if(p){ p.alive=true; p.rolls=[]; p.rollMap={}; p.hand=[]; }});
  broadcastLobby();
}

/** ===== Host game ops ===== **/
function hostTakeSeat(seat, _uid, name){
  if (seat<0 || seat>=H.players.length) return;
  if (H.players[seat]) return;
  if (H.players.findIndex(p=>p && p.uid===_uid)>=0) return;
  H.players[seat] = { uid:_uid, name, alive:true, rolls:[], rollMap:{}, hand:[] };
  broadcastLobby();
}
function hostPlay(_uid, indices){
  const seat = H.players.findIndex(p=>p && p.uid===_uid);
  if (seat !== H.turn) return; // 不是你回合
  const p = H.players[seat]; if (!p || !p.alive) return;
  if (!Array.isArray(indices) || indices.length===0) return;
  // 取牌
  const sorted = [...indices].sort((a,b)=>b-a);
  const cards=[]; for (const i of sorted){ if (i<0 || i>=p.hand.length) return; cards.push(p.hand.splice(i,1)[0]); }
  H.pot.push({by:p.uid, cards, declared:H.target});
  H.awaitingReveal=false; H.challengerId=null;
  H.turn = nextAliveFrom(H, H.turn);
  broadcastState();
  // 给该玩家下发手牌；若是 Host，自行本地同步
  if (p.uid === me.uid && isHost){
    myHand = p.hand.slice(); myHandHash = hashHand(myHand); renderHandOnly();
  } else {
    post({t:"HAND", to:p.uid, hand:p.hand});
  }
}
function hostLiar(_uid){
  H.challengerId = _uid;
  H.awaitingReveal = true;
  // 清理上一次的翻面缓存
  lastReveal = null;
  broadcastState();
}
function hostReveal(){
  if (!H.awaitingReveal || H.pot.length===0) return;
  const last = H.pot[H.pot.length-1];
  // 本地&广播只亮“最后一批”
  lastReveal = last.cards.map(c=>({...c}));
  renderAll();
  post({t:"REVEAL_VIEW", cards:last.cards.map(c=>({...c})) });

  setTimeout(()=>{
    const truthful = last.cards.every(c=>isMatch(c, H.target));
    const loserId  = truthful ? H.challengerId : last.by;   // 失败者
    const winnerId = truthful ? last.by : H.challengerId;   // ★ 胜者（下一轮先手）
    const loserSeat  = H.players.findIndex(p=>p && p.uid===loserId);
    const winnerSeat = H.players.findIndex(p=>p && p.uid===winnerId);

    if (loserSeat<0) return;
    const P = H.players[loserSeat];
    const roll = 1 + rnd(6);
    P.rolls.push(roll); P.rollMap[roll]=(P.rollMap[roll]||0)+1;
    let dieNow = (roll===6) || (P.rollMap[roll]>=2);
    if (dieNow){ P.alive=false; P.hand=[]; }

    // 重新发牌（仅存活），由胜者先手（若胜者死亡则找下一个存活）
    const startIndex = (winnerSeat>=0 && H.players[winnerSeat]?.alive) ? winnerSeat : nextAliveFrom(H, loserSeat);
    redealFrom(startIndex);
  }, 3000);
}
function redealFrom(startIndex){
  const alive = H.players.filter(p=>p && p.alive);
  if (alive.length<=1){ broadcastState(true); return; }

  const deck = makeCustomDeck();
  const need = alive.length * H.settings.startHand;
  if (need > deck.length){
    H.settings.startHand = Math.max(1, Math.floor(deck.length / alive.length));
  }
  for (const p of H.players){
    if (p && p.alive) p.hand = deck.splice(0,H.settings.startHand);
    else if (p) p.hand=[];
  }
  H.pot=[]; H.target = TARGETS[rnd(TARGETS.length)];
  H.roundNo = (H.roundNo||0)+1;
  H.turn = startIndex;
  H.awaitingReveal=false; H.challengerId=null;
  lastReveal = null; lastTurnUid = null;

  // 主机本地先同步手牌
  if (isHost){
    const hostSeat = H.players.findIndex(p=>p && p.uid===me.uid);
    if (hostSeat >= 0){ myHand = H.players[hostSeat].hand.slice(); myHandHash = hashHand(myHand); renderHandOnly(); }
  }

  // 先发手牌，再广播状态（避免“轮到你了但没手牌”）
  sendHands();
  broadcastState();
}
function sendHands(){ H.players.forEach(p=>{ if (p && p.alive) post({t:"HAND", to:p.uid, hand:p.hand}); }); }

/** ===== Back to lobby after win ===== **/
function hostBackToLobbyReset(){
  // 回到大厅：保留座位，复位状态，所有人恢复存活、清空手牌/骰点
  H.roundNo = 0; H.pot=[]; H.awaitingReveal=false; H.challengerId=null;
  H.target=null; H.turn=0;
  H.players.forEach(p=>{ if(p){ p.alive=true; p.rolls=[]; p.rollMap={}; p.hand=[]; }});
  broadcastLobby();
  enterLobbyUI();
}

/** ===== Broadcast helpers ===== **/
function broadcastLobby(){
  const canStart = (H.players.filter(p=>p && p.alive).length >= 2);
  const lobby = {
    roomId: H.roomId,
    settings: H.settings,
    seats: H.players.map(p=> p ? {uid:p.uid, name:p.name, alive:p.alive, rolls:p.rolls} : null),
    canStart
  };
  post({t:"LOBBY", lobby});
  renderLobbyLocal(lobby);
}
function broadcastState(withWinner=false){
  const winner = withWinner ? (H.players.find(p=>p && p.alive) || null) : null;
  const state = {
    roomId: H.roomId,
    roundNo: H.roundNo,
    target: H.target,
    turn: H.turn,
    awaitingReveal: H.awaitingReveal,
    lastClaim: H.pot.length? { by:H.pot[H.pot.length-1].by, count:H.pot[H.pot.length-1].cards.length } : null,
    pot: H.pot.map(b=>({ by: b.by, count: b.cards.length })), // 只发数量，不发牌面
    players: H.players.map(p=> p ? {uid:p.uid,name:p.name,alive:p.alive, handCount:p.hand.length, rolls:p.rolls} : null),
    winner: winner ? {uid:winner.uid, name:winner.name} : null
  };
  post({t:"STATE", state});
  S = state; renderAll();
}

/** ===== Client-side snapshots ===== **/
let L = null; // lobby
let S = null; // state
let myHand = []; // only mine
let myHandHash = ""; // 手牌版本，用来判断是否真的变化
let lastReveal = null;
let lastTurnUid = null; // 用于“你的回合”提示节流
function hashHand(h){ return (h||[]).map(c=>c.r).join('|'); }

/** ===== Message handler (both roles) ===== **/
function handleMessage(msg){
  switch(msg.t){
    case "HELLO": if (isHost){ broadcastLobby(); post({t:"WELCOME", from:"host"}); } break;
    case "WELCOME": break;
    case "TAKE_SEAT": if (isHost) hostTakeSeat(msg.seat, msg.uid, msg.name); break;
    case "REQ_SETTINGS": if (isHost) broadcastLobby(); break;
    case "PLAY": if (isHost) hostPlay(msg.uid, msg.indices); break;
    case "LIAR": if (isHost) hostLiar(msg.uid); break;
    case "REVEAL": if (isHost) hostReveal(); break;
    case "HOST_APPLY": if (isHost) hostApplySettings(); break;
    case "HOST_START": if (isHost) hostStart(); break;
    case "HOST_RESTART": if (isHost) hostRestart(); break;
    case "BACK_TO_LOBBY": if (isHost) hostBackToLobbyReset(); break;
    case "HAND_REQ": 
      // 目前已不轮询；保留以兼容，但 Host 只在需要时发 HAND（已在 sendHands() 实现）
      if (isHost){ const p=H.players.find(x=>x && x.uid===msg.uid); if (p) post({t:"HAND", to:p.uid, hand:p.hand}); }
      break;

    case "STATE": if (!isHost){ S = msg.state; renderAll(); } break;
    case "LOBBY":
      if (!isHost){ L = msg.lobby; renderLobby(); enterLobbyUI(); }
      break;
    case "HAND":
      if (msg.to === uid){
        const newHand = msg.hand||[];
        const newHash = hashHand(newHand);
        if (newHash !== myHandHash){
          myHand = newHand;
          myHandHash = newHash;
          selectedIndices.clear();   // 只有手牌真的变化才清空选择
          renderAll();               // 重新评估按钮可用性
        }
        // 如果相同，就不打扰当前选择
      }
      break;
    case "REVEAL_VIEW":
      if (!isHost){
        lastReveal = msg.cards||[];
        toast("正在翻开最近一次出牌…");
        renderAll();
      }
      break;
  }
}

/** ===== Lobby & Game UI switch ===== **/
function enterLobbyUI(){
  document.getElementById("connect").classList.add("hidden");
  document.getElementById("game").classList.add("hidden");
  document.getElementById("lobby").classList.remove("hidden");
}
function enterGameUI(){
  document.getElementById("lobby").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
}

/** ===== Lobby UI ===== **/
function renderLobby(){ renderLobbyLocal(L); }
function renderLobbyLocal(lobby){
  const seats = document.getElementById("seats"); seats.innerHTML="";
  const seatsN = lobby.settings.seats;
  for(let i=0;i<seatsN;i++){
    const cell = document.createElement('div'); cell.className = "border rounded-xl p-3 flex flex-col gap-2";
    const occupant = lobby.seats[i];
    if (occupant){
      cell.innerHTML = `<div class="font-semibold">座位 ${i+1}</div>
        <div>${occupant.name}</div>
        <div class="text-sm text-slate-600">${occupant.alive? "在座" : "淘汰"}</div>`;
    } else {
      cell.innerHTML = `<div class="font-semibold">座位 ${i+1}</div>
        <button class="px-3 py-2 rounded-lg bg-emerald-600 text-white">加入此座位</button>`;
      const btn = cell.querySelector('button');
      btn.onclick = ()=> post({t:"TAKE_SEAT", seat:i, uid:uid, name:me.name});
    }
    seats.appendChild(cell);
  }
  if (isHost){
    const btn = document.getElementById("btnStart");
    if (btn) btn.disabled = !lobby.canStart;
  }
}

/** ===== Game UI ===== **/
function renderAll(){
  if (!S) return;
  if (S.winner){
    document.getElementById("winnerName").textContent = S.winner.name;
    document.getElementById("winnerWrap").classList.remove("hidden");
  }
  enterGameUI();
  document.getElementById("roundNo").textContent = S.roundNo||1;
  document.getElementById("targetRank").textContent = S.target||"-";
  const currentSeat = S.turn;
  const currentPlayer = S.players[currentSeat];
  document.getElementById("currentPlayer").textContent = currentPlayer ? currentPlayer.name : "-";

  // players row
  const row = document.getElementById("playersRow"); row.innerHTML="";
  S.players.forEach((p,i)=>{
    if (p===null) return;
    const wrap = document.createElement('div');
    wrap.className = "border rounded-xl p-3 flex flex-col gap-2 " + (i===currentSeat?"border-indigo-500":"border-slate-200");
    if (!p.alive) wrap.classList.add("dead");
    const rollsTxt = p.rolls?.length ? p.rolls.join(", ") : "—";
    wrap.innerHTML = `
      <div class="flex items-center justify-between">
        <div class="font-semibold">${p.name}</div>
        <div class="text-sm text-slate-500">手牌 ${p.handCount}</div>
      </div>
      <div class="flex items-center gap-2 text-sm flex-wrap">
        <span class="badge">骰：${rollsTxt}</span>
        ${p.alive ? '' : '<span class="badge" style="border-color:#ef4444;color:#ef4444">已淘汰</span>'}
        ${i===currentSeat && p.alive ? '<span class="badge" style="border-color:#818cf8;color:#6366F1">出牌中</span>' : ''}
      </div>`;
    row.appendChild(wrap);
  });

  // 桌面：翻开阶段仅显示被质疑的“最后一批”
  const potDiv = document.getElementById("pot"); potDiv.innerHTML="";
  if (S.pot.length){
    const dataBatches = S.awaitingReveal ? [ S.pot[S.pot.length-1] ] : S.pot;
    dataBatches.forEach((batch)=>{
      const rowDiv = document.createElement('div'); rowDiv.className = "flex items-center gap-2 mb-2";
      const who = (S.players.find(x=>x && x.uid===batch.by)||{}).name || "未知";
      rowDiv.innerHTML = `<span class="text-sm text-slate-600">${who}：宣称 ${S.target} × ${batch.count}</span>`;
      const cards = document.createElement('div');
      for(let k=0;k<batch.count;k++){
        const c=document.createElement('div'); c.className="card";
        if (S.awaitingReveal && lastReveal && lastReveal[k]){
          if (lastReveal[k].r === "JOKER") c.classList.add('joker');
          c.textContent = cardText(lastReveal[k]);
        } else {
          c.textContent="🂠";
        }
        cards.appendChild(c);
      }
      rowDiv.appendChild(cards); potDiv.appendChild(rowDiv);
    });
  }
  document.getElementById("lastClaim").textContent = S.lastClaim ? `最近：${(S.players.find(p=>p&&p.uid===S.lastClaim.by)||{}).name||"未知"} × ${S.lastClaim.count}` : "—";

  // 回合控制
  const yourTurnTag = document.getElementById("yourTurnTag");
  const amIturn = (currentPlayer && currentPlayer.uid===uid && currentPlayer.alive);
  document.getElementById("btnReveal").classList.toggle("hidden", !S.awaitingReveal);
  document.getElementById("btnPlay").disabled = S.awaitingReveal || !amIturn || (myHand.length===0);
  document.getElementById("btnLiar").disabled = S.awaitingReveal || S.pot.length===0 || !amIturn;
  yourTurnTag.classList.toggle("hidden", !amIturn);

  // 到你时提示一次
  const nowTurnUid = currentPlayer ? currentPlayer.uid : null;
  if (nowTurnUid === uid && lastTurnUid !== uid){
    toast("你的回合");
  }
  lastTurnUid = nowTurnUid;

  renderHandOnly();
}
const selectedIndices = new Set();
function renderHandOnly(){
  const handDiv = document.getElementById("hand"); if (!handDiv) return;
  handDiv.innerHTML = "";
  const sel = selectedIndices;
  myHand = myHand||[];
  myHand.forEach((card, idx)=>{
    const d=document.createElement('div');
    d.className = "card"+(card.r==="JOKER"?" joker":"")+(sel.has(idx)?" sel":"");
    d.textContent = cardText(card);
    d.onclick = ()=>{ if (sel.has(idx)) sel.delete(idx); else sel.add(idx); document.getElementById("btnPlay").textContent = `出牌（${sel.size}）`; d.classList.toggle("sel"); };
    handDiv.appendChild(d);
  });
  document.getElementById("btnPlay").textContent = `出牌（${sel.size}）`;
}

/** ===== Wire controls ===== **/
document.getElementById("btnCreate").onclick = ()=>{
  const name = (document.getElementById("nick").value||"Player").trim();
  const rid = Math.random().toString(36).slice(2,7).toUpperCase();
  hostInit(rid, name);
};
document.getElementById("btnJoin").onclick = ()=>{
  const name = (document.getElementById("nick").value||"Player").trim();
  const rid = (document.getElementById("roomInput").value||"").trim().toUpperCase();
  if (!rid) return alert("请输入房间号");
  guestJoin(rid, name);
  post({t:"REQ_SETTINGS"});
};
document.getElementById("btnResetAll").onclick = ()=> location.reload();

// Host 本地直调 / Guest 广播
function applySettingsLocalOrBroadcast(){ if (isHost) hostApplySettings(); else post({t:"HOST_APPLY"}); }
function startLocalOrBroadcast(){ if (isHost) hostStart(); else post({t:"HOST_START"}); }
function restartLocalOrBroadcast(){ if (isHost) hostRestart(); else post({t:"HOST_RESTART"}); }
function playLocalOrBroadcast(indices){ if (isHost) hostPlay(uid, indices); else post({t:"PLAY", uid, indices}); }
function liarLocalOrBroadcast(){ if (isHost) hostLiar(uid); else post({t:"LIAR", uid}); }
function revealLocalOrBroadcast(){ if (isHost) hostReveal(); else post({t:"REVEAL"}); }
function backLobbyLocalOrBroadcast(){ if (isHost) hostBackToLobbyReset(); else post({t:"BACK_TO_LOBBY"}); }

document.getElementById("btnApply").onclick = applySettingsLocalOrBroadcast;
document.getElementById("seatMax").addEventListener("change", applySettingsLocalOrBroadcast);
document.getElementById("startHand").addEventListener("change", applySettingsLocalOrBroadcast);
document.getElementById("btnStart").onclick = startLocalOrBroadcast;
document.getElementById("btnHostRestart").onclick = restartLocalOrBroadcast;

document.getElementById("btnPlay").onclick = ()=>{
  if (selectedIndices.size===0) return toast("请选择至少 1 张");
  const indices = Array.from(selectedIndices).sort((a,b)=>a-b);
  playLocalOrBroadcast(indices);
  selectedIndices.clear();
  document.getElementById("btnPlay").textContent = `出牌（0）`;
};
document.getElementById("btnLiar").onclick = ()=> liarLocalOrBroadcast();
document.getElementById("btnReveal").onclick = ()=> revealLocalOrBroadcast();
document.getElementById("btnBackLobby").onclick = ()=> {
  document.getElementById("winnerWrap").classList.add("hidden");
  backLobbyLocalOrBroadcast();
};

// ⚠️ 已移除：自动 HAND_REQ 轮询（这就是导致“选择时间只有 1 秒”的元凶）
</script>
