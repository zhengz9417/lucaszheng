<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>whos — Lucas Zheng</title>
  <meta name="description" content="Album: whos — sequential demo playback" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body{font-family:Inter,ui-sans-serif,system-ui;-webkit-font-smoothing:antialiased}
    .track-active{background-color:#1f2937;color:#fff}
    .progress { appearance:none; height:6px; width:100%; border-radius:999px; background:#374151; }
    .progress::-webkit-slider-thumb { appearance:none; width:14px; height:14px; border-radius:999px; background:#fff; border:2px solid #111; margin-top:-4px; }
    .progress::-moz-range-thumb { width:14px; height:14px; border-radius:999px; background:#fff; border:2px solid #111; }
  </style>
</head>
<body class="bg-black text-gray-100">

  <!-- 顶部 -->
  <header class="bg-black/60 border-b border-white/10 backdrop-blur sticky top-0 z-10">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between">
      <a href="./" class="text-sm text-gray-300 hover:text-white">&larr; Back to Home</a>
      <h1 class="text-base sm:text-lg font-semibold">Album — whos</h1>
      <span class="text-sm text-transparent select-none">.</span>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8 pb-28"><!-- 预留底栏高度 -->
    <!-- 封面 -->
    <div class="w-full max-w-md mx-auto">
      <div class="rounded-2xl overflow-hidden ring-1 ring-white/10 shadow-xl">
        <img src="images/blues.jpg" alt="Album cover: whos" class="w-full aspect-square object-cover">
      </div>
      <h2 class="text-2xl font-semibold mt-4 text-white">whos</h2>
      <p class="text-xs text-gray-400 mt-1">顺序播放 · 点击曲目可跳转 · 自动连播</p>
    </div>

    <!-- 曲目列表 -->
    <section class="mt-5 max-w-md mx-auto w-full">
      <ol id="trackList" class="divide-y divide-white/10 border border-white/10 rounded-xl overflow-hidden bg-white/5">
        <!-- JS 动态插入 -->
      </ol>
      <p class="mt-3 text-[11px] text-gray-500">
        * 文件请放在 <code>musicdemo/</code> 目录；含空格会自动编码，无需改名。
      </p>
    </section>
  </main>

  <!-- 底栏迷你播放器 -->
  <div class="fixed bottom-0 left-0 right-0 z-20">
    <div class="backdrop-blur bg-black/70 border-t border-white/10">
      <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
        <!-- audio 元素 -->
        <audio id="player" preload="metadata"></audio>

        <div class="flex items-center gap-3">
          <button id="btnPrev" class="px-2 py-1 rounded-md border border-white/20 text-sm hover:bg-white/5">⏮</button>
          <button id="btnPlay" class="px-2 py-1 rounded-md border border-white/20 text-sm hover:bg-white/5">▶️</button>
          <button id="btnNext" class="px-2 py-1 rounded-md border border-white/20 text-sm hover:bg-white/5">⏭</button>

          <div class="min-w-0 flex-1">
            <div id="nowTitle" class="text-sm text-gray-200 truncate">—</div>
            <div class="flex items-center gap-2">
              <span id="curTime" class="text-[10px] tabular-nums text-gray-400 w-10 text-right">0:00</span>
              <input id="progress" class="progress" type="range" min="0" max="100" step="0.1" value="0" />
              <span id="durTime" class="text-[10px] tabular-nums text-gray-400 w-10">0:00</span>
            </div>
          </div>
          <button id="btnLoop" class="px-2 py-1 rounded-md border border-white/20 text-xs hover:bg-white/5" title="整张循环">循环</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="mt-10 py-8 text-center text-xs text-gray-500">
    © <span id="year"></span> Lucas Zheng
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // 曲目清单（Los Angles 放在倒数第二首）
    const tracks = [
      { title: "1 intro",                file: "1 intro.m4a",                type: "audio/mp4"  },
      { title: "2 daylight concept",     file: "2 daylight concept.m4a",     type: "audio/mp4"  },
      { title: "3 melodic demo",         file: "3 melodic demo.m4a",         type: "audio/mp4"  },
      { title: "4 weed fully complete",  file: "4 weed fully complete.mp3",  type: "audio/mpeg" },
      { title: "5 sheleft demo",         file: "5 sheleft demo.m4a",         type: "audio/mp4"  },
      { title: "6 swear concept",        file: "6 swear concept.m4a",        type: "audio/mp4"  },
      { title: "Los Angles",             file: "Los Angles.mp3",             type: "audio/mpeg" },
      { title: "hunniek bonus track",    file: "hunniek bonus track.mp3",    type: "audio/mpeg" }
    ];

    const player = document.getElementById('player');
    const trackListEl = document.getElementById('trackList');
    const nowTitle = document.getElementById('nowTitle');
    const btnPlay = document.getElementById('btnPlay');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const btnLoop = document.getElementById('btnLoop');
    const progress = document.getElementById('progress');
    const curTime = document.getElementById('curTime');
    const durTime = document.getElementById('durTime');

    let current = 0;
    let albumLoop = true;

    // 生成列表
    tracks.forEach((t, i) => {
      const li = document.createElement('li');
      li.className = "flex items-center justify-between text-sm";
      li.innerHTML = `
        <button data-idx="${i}" class="w-full text-left px-3 py-2 hover:bg-white/5">
          ${String(i+1).padStart(2,'0')}. ${t.title}
          <span class="ml-2 text-[11px] text-gray-400">${t.type.replace('audio/','')}</span>
        </button>
      `;
      trackListEl.appendChild(li);
    });

    function fmt(sec){ if (!isFinite(sec)) return "0:00"; const m=Math.floor(sec/60); const s=Math.floor(sec%60); return `${m}:${String(s).padStart(2,'0')}`; }

    function setSource(index, autoplay = false) {
      current = index;
      const t = tracks[current];
      const src = "musicdemo/" + encodeURIComponent(t.file);
      player.src = src;
      nowTitle.textContent = t.title;
      highlight();
      if (autoplay) player.play().catch(()=>{});
      updatePlayButton();
    }

    function highlight() {
      [...trackListEl.querySelectorAll('button')].forEach(btn => btn.classList.remove('track-active'));
      const btn = trackListEl.querySelector(`button[data-idx="${current}"]`);
      if (btn) btn.classList.add('track-active');
    }

    function updatePlayButton() {
      btnPlay.textContent = player.paused ? "▶️" : "⏸";
    }

    // 事件
    trackListEl.addEventListener('click', e => {
      const btn = e.target.closest('button[data-idx]');
      if (!btn) return;
      setSource(Number(btn.dataset.idx), true);
    });
    btnPlay.addEventListener('click', () => { if (!player.src) setSource(0,true); else if (player.paused) player.play(); else player.pause(); updatePlayButton(); });
    btnPrev.addEventListener('click', () => { setSource((current - 1 + tracks.length) % tracks.length, true); });
    btnNext.addEventListener('click', () => { setSource((current + 1) % tracks.length, true); });
    btnLoop.addEventListener('click', () => { albumLoop=!albumLoop; btnLoop.classList.toggle('bg-white/10',albumLoop); btnLoop.textContent=albumLoop?'循环':'单次'; });

    player.addEventListener('loadedmetadata', () => { durTime.textContent = fmt(player.duration); progress.value = 0; });
    player.addEventListener('timeupdate', () => { if(player.duration){ progress.value = (player.currentTime/player.duration)*100; curTime.textContent=fmt(player.currentTime); durTime.textContent=fmt(player.duration);} });
    progress.addEventListener('input', () => { if(player.duration) player.currentTime = (progress.value/100)*player.duration; });

    player.addEventListener('ended', () => { 
      if(current<tracks.length-1) setSource(current+1,true); 
      else if(albumLoop) setSource(0,true); 
      else {player.currentTime=0; updatePlayButton();}
    });
    player.addEventListener('play', updatePlayButton);
    player.addEventListener('pause', updatePlayButton);

    // 默认载入第一首
    setSource(0,false);
  </script>
</body>
</html>
